<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>מערכת שו"ב - V28 (Logo Fix)</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* BASE & LAYOUT */
        body { margin: 0; height: 100vh; overflow: hidden; font-family: 'Segoe UI', sans-serif; background: #2c3e50; display: flex; flex-direction: column; }
        
        /* HEADER */
        #top-bar { 
            height: 70px; background: #1a1a1a; color: white; display: flex; align-items: center; 
            justify-content: space-between; padding: 0 15px; border-bottom: 4px solid #c0392b; z-index: 2000; flex-shrink: 0;
        }
        .header-section { display: flex; align-items: center; gap: 15px; }
        .logo-container { width: 60px; height: 60px; border-radius: 50%; overflow: hidden; background: white; border: 2px solid #ecf0f1; display: flex; align-items: center; justify-content: center; }
        .logo-img { width: 100%; height: 100%; object-fit: contain; } /* תיקון לתצוגת הלוגו */
        .meteo-box { background: #34495e; padding: 5px 10px; border-radius: 5px; border: 1px solid #7f8c8d; font-size: 0.8rem; text-align: center; color: #ecf0f1; }
        .clock-display { font-family: monospace; font-size: 1.4rem; font-weight: bold; color: #f1c40f; text-shadow: 1px 1px 2px black; }

        /* MAIN CONTENT */
        #main-container { display: flex; flex: 1; height: calc(100% - 70px); position: relative; }
        
        /* MAP */
        #map { flex: 1; background: #333; position: relative; z-index: 1; }

        /* SIDEBAR */
        #sidebar { 
            width: 320px; background: #f8f9fa; border-right: 2px solid #ccc; z-index: 1500; 
            display: flex; flex-direction: column; height: 100%;
        }
        
        .sidebar-header { padding: 10px; background: #e9ecef; font-weight: bold; border-bottom: 1px solid #bdc3c7; display: flex; justify-content: space-between; align-items: center; }
        
        #log-container { flex: 2; overflow-y: auto; background: white; padding: 5px; border-bottom: 2px solid #bdc3c7; min-height: 0; }
        .log-entry { font-size: 0.8rem; padding: 4px 0; border-bottom: 1px solid #eee; }
        .log-role { font-weight: bold; color: #2980b9; }
        
        #requests-container { flex: 1; overflow-y: auto; background: #fff3cd; padding: 5px; min-height: 100px; border-bottom: 2px solid #bdc3c7; }
        .req-card { background: white; border: 1px solid #f39c12; padding: 5px; margin-bottom: 5px; font-size: 0.8rem; border-radius: 4px; }
        
        #chat-container { padding: 10px; background: #ecf0f1; }

        /* FLOATING TOOLS (Draggable) */
        .draggable-panel { 
            position: absolute; background: rgba(255, 255, 255, 0.95); 
            border-radius: 8px; box-shadow: 0 5px 20px rgba(0,0,0,0.4); 
            z-index: 1000; min-width: 60px; display: flex; flex-direction: column; 
            border: 1px solid #95a5a6; overflow: hidden;
        }
        .panel-handle { background: #2c3e50; height: 18px; cursor: move; width: 100%; display: flex; justify-content: center; align-items: center; }
        .panel-handle::after { content: '...'; color: white; line-height: 10px; }
        .tool-grid { display: grid; grid-template-columns: 1fr; gap: 5px; padding: 5px; }
        
        .btn-tool { width: 45px; height: 45px; border: 1px solid #bdc3c7; background: white; border-radius: 6px; font-size: 20px; cursor: pointer; transition: 0.1s; position: relative; }
        .btn-tool:hover { background: #ecf0f1; transform: scale(1.05); }
        .btn-tool.active { background: #3498db; color: white; border-color: #2980b9; box-shadow: inset 0 0 5px rgba(0,0,0,0.3); }

        /* RESOURCE PANELS */
        #resource-bank-ic { position: absolute; bottom: 20px; left: 20px; width: 400px; height: 120px; background: rgba(44, 62, 80, 0.95); color: white; border-radius: 8px; z-index: 2000; display: none; flex-direction: column; border: 2px solid #f39c12; }
        #reinforcement-panel-sector { position: absolute; bottom: 20px; left: 20px; width: 300px; height: 120px; background: rgba(39, 174, 96, 0.95); color: white; border-radius: 8px; z-index: 2000; display: none; flex-direction: column; border: 2px solid #2ecc71; }
        
        .panel-title { padding: 5px 10px; font-weight: bold; font-size: 0.85rem; border-bottom: 1px solid rgba(255,255,255,0.2); }
        .panel-items { flex: 1; padding: 10px; overflow-x: auto; display: flex; gap: 10px; align-items: center; }
        
        .res-item { background: white; color: #2c3e50; padding: 5px; border-radius: 4px; min-width: 60px; text-align: center; cursor: pointer; font-size: 0.8rem; border: 2px solid transparent; }
        .res-item:hover { transform: translateY(-2px); }
        .res-item.selected { border-color: #e74c3c; background: #fadbd8; }

        /* MAP ELEMENTS */
        .icon-unit-base { background: white; border: 2px solid black; display: flex; justify-content: center; align-items: center; font-weight: bold; font-size: 10px; position: relative; box-shadow: 2px 2px 4px rgba(0,0,0,0.5); }
        .unit-saar { width: 36px; height: 22px; border-color: #c0392b; color: #c0392b; }
        .unit-eshed { width: 46px; height: 26px; border-color: #8e44ad; color: #8e44ad; }
        .unit-water-bg { position: absolute; bottom: 0; left: 0; width: 100%; height: 3px; background: #ccc; }
        .unit-water-lvl { height: 100%; background: #3498db; }

        .sector-label { color: #f39c12; font-weight: bold; font-size: 14px; text-shadow: 1px 1px 2px black; white-space: nowrap; }

        /* LOGIN */
        #login-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(44, 62, 80, 0.98); z-index: 9999; display: flex; align-items: center; justify-content: center; }
        .login-box { background: white; padding: 30px; border-radius: 12px; width: 500px; text-align: center; box-shadow: 0 10px 40px rgba(0,0,0,0.6); }
        .role-btn { width: 100%; height: 50px; margin-bottom: 8px; border: 2px solid #e0e0e0; background: white; transition: 0.2s; border-radius: 6px; }
        .role-btn.selected { border-color: #c0392b; background: #fff5f5; color: #c0392b; font-weight: bold; }
    </style>
</head>
<body>

    <div id="login-overlay">
        <div class="login-box">
            <h2 class="text-danger mb-4"><i class="fa-solid fa-fire"></i> מערכת שו"ב - כניסה</h2>
            <div id="login-form">
                <div class="row g-2 mb-3">
                    <div class="col-4"><button class="btn role-btn" onclick="selectRole('admin', this)">מנהלת</button></div>
                    <div class="col-4"><button class="btn role-btn" onclick="selectRole('ic', this)">מפקד אירוע</button></div>
                    <div class="col-4"><button class="btn role-btn" onclick="selectRole('sector', this)">מפקד גזרה</button></div>
                </div>
                
                <div id="sector-select" class="mb-3" style="display:none;">
                    <label class="form-label fw-bold small">בחר גזרה:</label>
                    <select class="form-select text-center" id="sector-letter">
                        <option value="א">גזרה א'</option>
                        <option value="ב">גזרה ב'</option>
                        <option value="ג">גזרה ג'</option>
                        <option value="ד">גזרה ד'</option>
                    </select>
                </div>

                <input type="text" id="username" class="form-control mb-3 text-center" placeholder="שם מלא (לדוח תחקיר)">
                <input type="text" id="game-id" class="form-control mb-4 text-center" value="drill_28">
                <button class="btn btn-danger w-100 py-3 fw-bold" onclick="enterSystem()">התחבר</button>
            </div>
        </div>
    </div>

    <div id="top-bar">
        <div class="header-section">
            <div class="logo-container">
                <img src="logo.jpg.png" class="logo-img" onerror="this.src='data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAxMDAgMTAwIj48cmVjdCB3aWR0aD0iMTAwIiBoZWlnaHQ9IjEwMCIgZmlsbD0iI2ZmZiIvPjx0ZXh0IHg9IjUwIiB5PSI1MCIgZm9udC1zaXplPSIxNCIgdGV4dC1hbmNob3I9Im1pZGRsZSI+TE9HTzwvdGV4dD48L3N2Zz4='">
            </div>
            <span id="user-badge" class="badge bg-secondary p-2">אורח</span>
            <div class="meteo-box">
                <div id="wind-data">-- קמ"ש</div>
            </div>
        </div>

        <div class="header-section text-center">
            <div class="small text-white-50">זמן מבצעי (x10)</div>
            <div id="game-clock" class="clock-display">T+00:00</div>
        </div>

        <div class="header-section">
            <button class="btn btn-sm btn-outline-light" onclick="window.print()">דוח</button>
        </div>
    </div>

    <div id="main-container">
        
        <div id="map">
            
            <div class="draggable-panel" id="panel-admin" style="top: 20px; right: 20px; display:none;">
                <div class="panel-handle"></div>
                <div class="tool-grid">
                    <button class="btn-tool" onclick="setTool('fire', event)" title="אש"><i class="fa-solid fa-fire text-danger"></i></button>
                    <button class="btn-tool" onclick="setTool('water', event)" title="מים"><i class="fa-solid fa-droplet text-primary"></i></button>
                    <button class="btn-tool" onclick="updateMeteo()" title="מזג אוויר"><i class="fa-solid fa-cloud-sun"></i></button>
                    <button class="btn-tool" onclick="addResToBank('saar')" title="+סער לבנק"><i class="fa-solid fa-plus"></i>🚒</button>
                    <button class="btn-tool" onclick="addResToBank('eshed')" title="+אשד לבנק"><i class="fa-solid fa-plus"></i>🚛</button>
                    <button class="btn-tool" onclick="resetGame()" title="איפוס"><i class="fa-solid fa-trash"></i></button>
                </div>
            </div>

            <div class="draggable-panel" id="panel-ic" style="top: 20px; right: 90px; display:none;">
                <div class="panel-handle"></div>
                <div class="tool-grid">
                    <button class="btn-tool" onclick="setTool('cp', event)" title="חפ''ק"><i class="fa-solid fa-flag text-danger"></i></button>
                    <button class="btn-tool" onclick="setTool('staging', event)" title="שטח כינוס"><i class="fa-solid fa-circle-h text-danger"></i></button>
                    <button class="btn-tool" onclick="setTool('sector_draw', event)" title="שרטוט גזרה (דאבל קליק לסיום)"><i class="fa-solid fa-draw-polygon text-warning"></i></button>
                    <button class="btn-tool" onclick="setTool('arrow', event)" title="חץ תקיפה"><i class="fa-solid fa-arrow-right"></i></button>
                </div>
            </div>

            <div class="draggable-panel" id="panel-sector" style="top: 250px; right: 20px; display:none;">
                <div class="panel-handle"></div>
                <div class="tool-grid">
                    <button class="btn-tool" onclick="requestRes('saar')" title="בקש סער">❓🚒</button>
                    <button class="btn-tool" onclick="requestRes('eshed')" title="בקש אשד">❓🚛</button>
                    <button class="btn-tool" onclick="activateMove(event)" id="btn-move" title="הזזת כוח"><i class="fa-solid fa-up-down-left-right text-primary"></i></button>
                    <button class="btn-tool" onclick="setTool('dozer', event)" title="D9"><i class="fa-solid fa-snowplow"></i></button>
                </div>
            </div>

            <div id="resource-bank-ic">
                <div class="panel-title">בנק כוחות (גרור לגזרה במפה)</div>
                <div class="panel-items" id="bank-list-ic"></div>
            </div>

            <div id="reinforcement-panel-sector">
                <div class="panel-title">כוחות להצבה (לחץ והצב במפה)</div>
                <div class="panel-items" id="sector-staging-list"></div>
            </div>

        </div>

        <div id="sidebar">
            <div class="sidebar-header">יומן מבצעים</div>
            <div id="log-container"></div>
            
            <div class="sidebar-header text-warning bg-light" style="font-size:0.8rem">בקשות ואישורים</div>
            <div id="requests-container"></div>
            
            <div id="chat-container">
                <div class="input-group">
                    <input type="text" id="chat-input" class="form-control" placeholder="פקודה... (רווח לדיבור)">
                    <button class="btn btn-primary" onclick="sendChat()">></button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, set, onValue, push, update, remove, get } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAprkTQI8h7ngt186yQSeYuBR37J7jjQBs",
            authDomain: "firesim2026.firebaseapp.com",
            databaseURL: "https://firesim2026-default-rtdb.firebaseio.com",
            projectId: "firesim2026",
            storageBucket: "firesim2026.firebasestorage.app",
            messagingSenderId: "816221488429",
            appId: "1:816221488429:web:8422845f75f8656d2abfa4",
            measurementId: "G-P77FYQT1C7"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // STATE
        let map, layers={};
        let myRole=null, myName="", mySector=null;
        let activeTool=null, selectedUnit=null;
        let activeBankItem=null, activeSectorStagingItem=null;
        let polyPoints=[]; // for drawing sectors
        let dragStart=null, tempLine=null;
        const TIME_FACTOR = 10;
        let gameState = { start: Date.now(), wind: 0, windDir: 0, sectorCount: 0 };

        // --- INIT ---
        window.selectRole = (role, btn) => {
            document.querySelectorAll('.role-btn').forEach(b => b.classList.remove('selected'));
            btn.classList.add('selected');
            myRole = role;
            document.getElementById('sector-select').style.display = (role === 'sector') ? 'block' : 'none';
        };

        window.enterSystem = () => {
            if(!myRole) return alert("בחר תפקיד");
            myName = document.getElementById('username').value || "User";
            if(myRole==='sector') mySector = document.getElementById('sector-letter').value;

            document.getElementById('login-overlay').style.display = 'none';
            
            // UI Setup
            let badge = myName + " | " + getRoleDisplayName();
            document.getElementById('user-badge').innerText = badge;
            logAction(`התחברות למערכת`);

            if(myRole==='admin') {
                document.getElementById('panel-admin').style.display='flex';
                document.getElementById('panel-sector').style.display='flex'; 
            } else if(myRole==='ic') {
                document.getElementById('panel-ic').style.display='flex';
                document.getElementById('panel-sector').style.display='flex';
                document.getElementById('resource-bank-ic').style.display='flex';
            } else {
                document.getElementById('panel-sector').style.display='flex';
                document.getElementById('reinforcement-panel-sector').style.display='flex';
            }

            makeDraggable();

            setTimeout(() => {
                initMap();
                syncFirebase();
                setInterval(gameLoop, 1000);
            }, 500);
        };

        function getRoleDisplayName() {
            if(myRole==='admin') return 'מנהלת';
            if(myRole==='ic') return 'מפקד אירוע';
            return `מפקד גזרה ${mySector}`;
        }

        function makeDraggable() {
            document.querySelectorAll('.draggable-panel').forEach(elm => {
                let header = elm.querySelector('.panel-handle');
                if(!header) return;
                header.onmousedown = e => {
                    e.preventDefault();
                    let x = e.clientX, y = e.clientY;
                    document.onmousemove = e => {
                        e.preventDefault();
                        elm.style.top = (elm.offsetTop - (y - e.clientY)) + "px";
                        elm.style.left = (elm.offsetLeft - (x - e.clientX)) + "px";
                        x = e.clientX; y = e.clientY;
                    };
                    document.onmouseup = () => { document.onmousemove = null; };
                };
            });
        }

        // --- MAP ENGINE ---
        function initMap() {
            map = L.map('map', {doubleClickZoom: false}).setView([32.73, 35.03], 14);
            L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}').addTo(map);
            L.tileLayer('https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png', {opacity: 0.4}).addTo(map);

            layers.fire = L.layerGroup().addTo(map);
            layers.polys = L.layerGroup().addTo(map); // Sectors
            layers.units = L.layerGroup().addTo(map);
            layers.drawings = L.layerGroup().addTo(map);
            layers.markers = L.layerGroup().addTo(map);

            map.on('click', onMapClick);
            map.on('dblclick', onMapDblClick); // Close Sector
            
            map.on('mousedown', e => {
                if(['arrow','dozer'].includes(activeTool)) { map.dragging.disable(); dragStart=e.latlng; }
            });
            map.on('mousemove', e => {
                if(dragStart) {
                    if(tempLine) map.removeLayer(tempLine);
                    let c = activeTool==='dozer'?'black':'red';
                    tempLine = L.polyline([dragStart, e.latlng], {color:c, weight:4}).addTo(map);
                }
            });
            map.on('mouseup', e => {
                if(dragStart) {
                    finishDrag(e.latlng); dragStart=null; map.dragging.enable(); if(tempLine) map.removeLayer(tempLine);
                }
            });
            
            setTimeout(()=>map.invalidateSize(), 500);
        }

        // --- INTERACTION ---
        function onMapClick(e) {
            const loc = e.latlng;

            // 1. Drawing Sector (Points)
            if(activeTool === 'sector_draw') {
                polyPoints.push(loc);
                L.marker(loc, {icon:L.divIcon({className:'bg-warning rounded-circle', iconSize:[6,6]})}).addTo(layers.drawings);
                return;
            }

            // 2. IC Assigns Unit to Sector (Click on Polygon)
            if(activeTool === 'assign_sector' && activeBankItem) {
                // Check if clicked inside a sector polygon
                let clickedSector = null;
                layers.polys.eachLayer(layer => {
                    if(layer instanceof L.Polygon && layer.getBounds().contains(loc)) {
                        // Simple bounds check, precise raycast is complex but this works for convex
                        clickedSector = layer.sectorName;
                    }
                });

                if(clickedSector) {
                    // Transfer ownership
                    assignUnitToSector(activeBankItem, clickedSector);
                } else {
                    alert("יש ללחוץ בתוך גזרה מסומנת");
                }
                return;
            }

            // 3. Sector Commander Places Unit
            if(activeTool === 'place_unit' && activeSectorStagingItem) {
                placeUnitOnMap(activeSectorStagingItem, loc);
                return;
            }

            // 4. Move Unit
            if(activeTool === 'move_dest' && selectedUnit) {
                update(ref(db, `games/drill_28/units/${selectedUnit}`), {
                    destLat: loc.lat, destLng: loc.lng, status: 'moving'
                });
                logAction(`פקודת תנועה`);
                activeTool = 'move_select'; selectedUnit=null;
                return;
            }

            if(!activeTool) return;

            // 5. Placements
            if(activeTool === 'fire' && myRole==='admin') {
                push(ref(db, `games/drill_28/units`), { type:'fire', lat:loc.lat, lng:loc.lng, start:getGameTime() });
                logAction("הצצת אש");
            }
            if(activeTool === 'cp') {
                push(ref(db, `games/drill_28/units`), { type:'marker', subType:'cp', lat:loc.lat, lng:loc.lng });
                logAction("הצבת חפ''ק");
            }
            if(activeTool === 'staging') {
                push(ref(db, `games/drill_28/units`), { type:'marker', subType:'staging', lat:loc.lat, lng:loc.lng });
                logAction("הצבת שטח כינוס");
            }
            if(activeTool === 'water') {
                push(ref(db, `games/drill_28/units`), { type:'marker', subType:'water', lat:loc.lat, lng:loc.lng });
            }

            if(!['arrow','dozer','sector_draw'].includes(activeTool)) resetTool();
        }

        function onMapDblClick(e) {
            if(activeTool === 'sector_draw' && polyPoints.length > 2) {
                createSector(polyPoints);
                polyPoints = [];
                resetTool();
            }
        }

        function finishDrag(end) {
            if(activeTool === 'dozer') {
                let mode = prompt("1-מלא, 2-חלקי","1")==='1'?'full':'partial';
                push(ref(db, `games/drill_28/units`), {
                    type:'drawing', subType:'dozer', p1:dragStart, p2:end, mode:mode, created:getGameTime()
                });
                logAction("סימון קו D9");
            } else {
                push(ref(db, `games/drill_28/units`), {
                    type:'drawing', subType:activeTool, p1:dragStart, p2:end
                });
                logAction("שרטוט חץ תקיפה");
            }
            resetTool();
        }

        // --- LOGIC ---
        async function createSector(points) {
            const s = await get(ref(db, `games/drill_28/state/sectorCount`));
            let count = s.val() || 0;
            let name = String.fromCharCode(1488 + count); // Aleph, Bet...
            
            push(ref(db, `games/drill_28/units`), {
                type: 'sector', name: name, points: points
            });
            update(ref(db, `games/drill_28/state`), { sectorCount: count + 1 });
            logAction(`הגדרת גזרה ${name}`);
        }

        // IC BANK LOGIC
        window.addResToBank = (type) => {
            push(ref(db, `games/drill_28/bank`), { type: type, status: 'available' });
            logAction(`הוספת ${type} לבנק`);
        };

        function assignUnitToSector(bankKey, sectorName) {
            // Remove from Bank
            remove(ref(db, `games/drill_28/bank/${bankKey}`));
            // Add to Sector Staging (Special Unit Status)
            push(ref(db, `games/drill_28/sector_staging`), {
                type: activeBankItem.type,
                sector: sectorName,
                status: 'pending_placement'
            });
            logAction(`העברת כוח לגזרה ${sectorName}`);
            activeBankItem = null;
            resetTool();
        }

        function placeUnitOnMap(stagingKey, loc) {
            remove(ref(db, `games/drill_28/sector_staging/${stagingKey}`));
            
            push(ref(db, `games/drill_28/units`), {
                type: 'unit', subType: activeSectorStagingItem.type,
                lat: loc.lat, lng: loc.lng,
                sector: mySector,
                water: 100, status: 'idle',
                callSign: Math.floor(Math.random()*100)+400
            });
            logAction(`הצבת כוח בגזרה`);
            activeSectorStagingItem = null;
            resetTool();
        }

        window.requestRes = (type) => {
            if(myRole==='admin') { addResToBank(type); return; }
            push(ref(db, `games/drill_28/requests`), { type:type, by:getRoleDisplayName(), time:Date.now() });
            alert("נשלח לאישור");
        };

        // --- SYNC ---
        function syncFirebase() {
            // STATE
            onValue(ref(db, `games/drill_28/state`), s => {
                let v = s.val();
                if(v) { gameState = {...gameState, ...v}; document.getElementById('wind-data').innerText=`${gameState.wind||0} קמ"ש`; }
                else if(myRole==='admin') set(ref(db, `games/drill_28/state`), {start:Date.now(), wind:10, sectorCount:0});
            });

            // UNITS & MAP
            onValue(ref(db, `games/drill_28/units`), s => renderMap(s.val()));

            // BANK (IC)
            if(myRole === 'ic') {
                onValue(ref(db, `games/drill_28/bank`), s => renderIcBank(s.val()));
                onValue(ref(db, `games/drill_28/requests`), s => renderRequests(s.val()));
            }

            // SECTOR STAGING (Sector Cmdr)
            if(myRole === 'sector') {
                onValue(ref(db, `games/drill_28/sector_staging`), s => renderSectorStaging(s.val()));
            }

            // LOGS
            onValue(ref(db, `games/drill_28/logs`), s => renderLogs(s.val()));
        }

        function renderMap(data) {
            layers.fire.clearLayers(); layers.polys.clearLayers(); layers.units.clearLayers();
            layers.drawings.clearLayers(); layers.markers.clearLayers();
            if(!data) return;
            const gt = getGameTime();

            Object.entries(data).forEach(([k, obj]) => {
                
                if(obj.type === 'sector') {
                    const poly = L.polygon(obj.points, {color:'orange', fillOpacity:0.1, weight:2, dashArray:'5,5'}).addTo(layers.polys);
                    poly.sectorName = obj.name; // Store for click detection
                    const center = poly.getBounds().getCenter();
                    L.marker(center, {icon:L.divIcon({className:'sector-label', html:`גזרה ${obj.name}`, iconSize:[100,20]})}).addTo(layers.polys);
                }

                else if(obj.type === 'unit') {
                    // Strict filtering for Sector Commanders
                    if(myRole === 'sector' && obj.sector && obj.sector !== mySector) return;

                    let pos = [obj.lat, obj.lng];
                    if(obj.status==='moving' && obj.destLat) pos = [obj.destLat, obj.destLng]; 

                    let cls = obj.subType==='saar'?'unit-saar':'unit-eshed';
                    let html = `<div class="icon-unit-base ${cls}">${obj.callSign}<div class="unit-water-bg"><div class="unit-water-lvl" style="width:${obj.water}%"></div></div></div>`;
                    
                    let m = L.marker(pos, {icon:L.divIcon({html:html, className:''})}).addTo(layers.units);
                    m.on('click', () => {
                        if(activeTool === 'move_select') {
                            if(myRole === 'sector' && obj.sector !== mySector) return alert("לא בגזרה שלך");
                            selectedUnit = k; activeTool='move_dest'; document.getElementById('map').style.cursor='crosshair'; alert("בחר יעד");
                        }
                    });
                }

                else if(obj.type === 'fire') {
                    // FAN LOGIC: Star at start, Cone expanding with wind
                    let el = (gt - obj.start)/1000;
                    
                    // 1. Draw Star (Start point)
                    L.marker([obj.lat, obj.lng], {icon:L.divIcon({html:'<i class="fa-solid fa-star text-danger fs-4"></i>', className:''})}).addTo(layers.fire);

                    // 2. Draw Fan (Polygon)
                    if(el > 10) {
                        let length = 50 + (el * (gameState.wind/10)); // Growth
                        let windRad = (gameState.windDir - 90) * (Math.PI / 180);
                        let spread = 0.6; // ~35 degrees spread
                        
                        // Calculate tip points
                        let latOffset = length / 111111;
                        let p1 = [
                            obj.lat + latOffset * Math.sin(windRad - spread),
                            obj.lng + latOffset * Math.cos(windRad - spread)
                        ];
                        let p2 = [
                            obj.lat + latOffset * Math.sin(windRad + spread),
                            obj.lng + latOffset * Math.cos(windRad + spread)
                        ];

                        L.polygon([[obj.lat, obj.lng], p1, p2], {
                            color: 'red', fillColor: '#e67e22', fillOpacity: 0.5, weight: 2
                        }).addTo(layers.fire);
                    }
                }

                else if(obj.type === 'drawing') {
                    let c = obj.subType==='dozer'?'black':'red';
                    let w = obj.subType==='arrow'?6:4;
                    L.polyline([obj.p1, obj.p2], {color:c, weight:w}).addTo(layers.drawings);
                }
                
                else if(obj.type === 'marker') {
                     let h = '';
                     if(obj.subType==='cp') h='<i class="fa-solid fa-flag text-danger fs-1"></i>';
                     if(obj.subType==='staging') h='<div class="icon-staging">S</div>';
                     if(obj.subType==='water') h='<i class="fa-solid fa-droplet text-primary fs-3"></i>';
                     L.marker([obj.lat, obj.lng], {icon:L.divIcon({html:h, className:''})}).addTo(layers.markers);
                }
            });
        }

        function renderIcBank(data) {
            const list = document.getElementById('bank-list-ic');
            list.innerHTML = "";
            if(!data) return;
            Object.entries(data).forEach(([k, v]) => {
                let d = document.createElement('div');
                d.className = 'res-item';
                d.innerHTML = `<div>🚛</div>${v.type}`;
                d.onclick = () => {
                    document.querySelectorAll('.res-item').forEach(x=>x.classList.remove('selected'));
                    d.classList.add('selected');
                    activeBankItem = { key: k, type: v.type };
                    activeTool = 'assign_sector';
                    alert("כעת לחץ על גזרה במפה כדי להקצות לה את הכוח");
                };
                list.appendChild(d);
            });
        }

        function renderSectorStaging(data) {
            const list = document.getElementById('sector-staging-list');
            list.innerHTML = "";
            if(!data) return;
            Object.entries(data).forEach(([k, v]) => {
                if(v.sector !== mySector) return; // Only my reinforcements
                let d = document.createElement('div');
                d.className = 'res-item';
                d.innerHTML = `<div>⬇️</div>${v.type}`;
                d.onclick = () => {
                    document.querySelectorAll('.res-item').forEach(x=>x.classList.remove('selected'));
                    d.classList.add('selected');
                    activeSectorStagingItem = { key: k, type: v.type };
                    activeTool = 'place_unit';
                    alert("לחץ במפה להצבת הכוח");
                };
                list.appendChild(d);
            });
        }
        
        function renderLogs(data) {
            const d = document.getElementById('log-container');
            d.innerHTML="";
            if(data) Object.values(data).slice(-40).forEach(l => {
                let t = new Date(l.time).toLocaleTimeString('he-IL',{hour:'2-digit',minute:'2-digit'});
                d.innerHTML += `<div class="log-entry"><span class="log-role">${l.roleTitle}:</span> ${l.text} <small class="text-muted">(${t})</small></div>`;
            });
            d.scrollTop = d.scrollHeight;
        }

        // --- UTILS ---
        window.setTool = (t, e) => {
            if(e) e.stopPropagation(); 
            activeTool = t; 
            if(t!=='move_select') selectedUnit=null;
            polyPoints = [];
            document.getElementById('map').style.cursor = 'crosshair';
            
            document.querySelectorAll('.btn-tool').forEach(b=>b.classList.remove('active'));
            if(e && e.currentTarget) e.currentTarget.classList.add('active');
        };
        
        window.resetTool = () => {
            activeTool = null; document.getElementById('map').style.cursor='grab';
            document.querySelectorAll('.btn-tool').forEach(b=>b.classList.remove('active'));
        };

        window.activateMove = (e) => {
            if(e) e.stopPropagation();
            activeTool = 'move_select';
            document.getElementById('map').style.cursor='pointer';
            document.getElementById('btn-move').classList.add('active');
            alert("בחר רכב להזזה");
        };

        window.updateMeteo = () => {
            let w = prompt("מהירות", gameState.wind);
            if(w) update(ref(db, `games/drill_28/state`), {wind:parseInt(w)});
        };

        window.logAction = (text) => {
            push(ref(db, `games/drill_28/logs`), {
                text: text, roleTitle: getRoleDisplayName(), time: Date.now()
            });
        };

        window.sendChat = () => {
            let t = document.getElementById('chat-input').value;
            if(t) logAction(t);
            document.getElementById('chat-input').value = "";
        };

        function getGameTime() { return (Date.now() - gameState.start) * TIME_FACTOR; }
        
        function gameLoop() {
            let gt = getGameTime();
            let min = Math.floor(gt/60000);
            document.getElementById('game-clock').innerText = `T+${Math.floor(min/60)}:${String(min%60).padStart(2,'0')}`;
        }
    </script>
</body>
</html>
