<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>מערכת שו"ב - V32 (Fixed)</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* CORE */
        body { margin: 0; height: 100vh; overflow: hidden; font-family: 'Segoe UI', sans-serif; background: #2c3e50; display: flex; flex-direction: column; }
        
        /* PRINT MODE */
        @media print {
            body * { visibility: hidden; }
            #report-view, #report-view * { visibility: visible; }
            #report-view { position: absolute; left: 0; top: 0; width: 100%; height: 100%; background: white; z-index: 99999; padding: 20px; }
            .no-print { display: none !important; }
        }

        /* HEADER & PLAYER PANEL */
        #top-bar { 
            height: 70px; background: #1a1a1a; color: white; display: flex; align-items: center; 
            justify-content: space-between; padding: 0 15px; border-bottom: 4px solid #e67e22; z-index: 2000; flex-shrink: 0;
        }
        .logo-box { width: 50px; height: 50px; background: white; border-radius: 50%; overflow: hidden; display: flex; align-items: center; justify-content: center; border: 2px solid #ccc; }
        .logo-box img { width: 100%; height: 100%; object-fit: contain; }
        
        /* COMPASS & METEO */
        .player-panel { display: flex; align-items: center; gap: 15px; background: #2c3e50; padding: 5px 15px; border-radius: 8px; border: 1px solid #566573; }
        .compass-wrap { position: relative; width: 40px; height: 40px; }
        .compass-icon { font-size: 36px; color: #e74c3c; transition: transform 0.5s ease; }
        .compass-text { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 10px; font-weight: bold; color: white; text-shadow: 1px 1px 1px black; }
        .meteo-info { font-size: 0.85rem; line-height: 1.2; color: #ecf0f1; }

        .clock-display { font-family: monospace; font-size: 1.5rem; font-weight: bold; color: #f1c40f; text-shadow: 1px 1px 2px black; }

        /* MAIN & MAP */
        #main-container { display: flex; flex: 1; height: calc(100% - 70px); position: relative; }
        #map { flex: 1; background: #333; position: relative; z-index: 1; }

        /* SIDEBAR */
        #sidebar { 
            width: 350px; background: #f8f9fa; border-right: 2px solid #ccc; z-index: 1500; 
            display: flex; flex-direction: column; height: 100%;
        }
        .sb-header { padding: 8px; background: #e9ecef; font-weight: bold; border-bottom: 1px solid #bdc3c7; font-size: 0.9rem; }
        #log-container { flex: 2; overflow-y: auto; background: white; padding: 5px; font-size: 0.8rem; border-bottom: 2px solid #bdc3c7; }
        .log-row { padding: 4px 0; border-bottom: 1px solid #eee; display: flex; gap: 5px; }
        .log-time { color: #7f8c8d; min-width: 40px; font-size: 0.75rem; }
        .log-role { font-weight: bold; color: #2980b9; font-size: 0.75rem; min-width: 70px; }
        
        #requests-container { flex: 1; overflow-y: auto; background: #fff3cd; padding: 5px; }
        .req-card { background: white; border: 1px solid #f39c12; padding: 6px; margin-bottom: 4px; font-size: 0.8rem; border-radius: 4px; display: flex; justify-content: space-between; align-items: center; }
        .req-card.pending-admin { border-color: #e74c3c; background: #fadbd8; }

        /* DRAGGABLE PANELS */
        .draggable-panel { 
            position: absolute; background: rgba(255, 255, 255, 0.98); 
            border-radius: 6px; box-shadow: 0 8px 30px rgba(0,0,0,0.5); 
            z-index: 1000; min-width: 90px; display: flex; flex-direction: column; 
            border: 1px solid #95a5a6; overflow: hidden; resize: both;
        }
        .panel-handle { background: #34495e; height: 24px; cursor: move; width: 100%; display: flex; justify-content: center; align-items: center; color: white; font-size: 0.8rem; }
        .tool-grid { display: grid; grid-template-columns: 1fr; gap: 5px; padding: 5px; overflow-y: auto; max-height: 400px; }
        
        .btn-tool { 
            width: 100%; height: 38px; border: 1px solid #bdc3c7; background: white; border-radius: 4px; 
            cursor: pointer; transition: 0.1s; display: flex; align-items: center; padding-right: 8px; gap: 8px; 
            font-weight: 500; font-size: 13px; position: relative; 
        }
        .btn-tool:hover { background: #ecf0f1; }
        .btn-tool.active { background: #3498db; color: white; border-color: #2980b9; }
        .btn-tool.available { background: #27ae60; color: white; border-color: #229954; animation: pulse 1.5s infinite; }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }

        /* CUSTOM ICONS */
        .icon-unit { background: white; border: 2px solid black; display: flex; justify-content: center; align-items: center; font-weight: bold; font-size: 10px; position: relative; box-shadow: 2px 2px 4px rgba(0,0,0,0.5); }
        .unit-saar { width: 36px; height: 22px; border-color: #c0392b; color: #c0392b; }
        .unit-eshed { width: 46px; height: 26px; border-color: #8e44ad; color: #8e44ad; }
        .unit-heli { width: 30px; height: 30px; border-radius: 50%; background: #fff; border: 2px solid #2980b9; color: #2980b9; display: flex; justify-content: center; align-items: center; font-size: 16px; }
        .unit-heli.inactive { opacity: 0.4; border-color: #95a5a6; color: #95a5a6; }
        
        /* TACTICAL SYMBOLS */
        .sym-risk { color: #27ae60; font-size: 24px; text-shadow: 0 0 2px black; }
        .sym-defense { width: 24px; height: 24px; background: black; border-radius: 50%; border: 2px solid white; position: relative; }
        .sym-defense::after { content: '▲'; color: white; position: absolute; top: -14px; left: 2px; font-size: 10px; transform: rotate(0deg); }
        
        .unit-water-fill { position: absolute; bottom: 0; left: 0; width: 100%; height: 3px; background: #3498db; }

        /* FIRE & PREDICTION */
        .fire-poly { stroke: red; stroke-width: 2; fill: #e67e22; fill-opacity: 0.5; }
        .burnt-poly { stroke: none; fill: #2c3e50; fill-opacity: 0.8; }
        .pred-line { stroke: #f1c40f; stroke-width: 2; stroke-dasharray: 10,10; fill: none; pointer-events: none; }
        .pred-label { font-size: 10px; color: #f1c40f; font-weight: bold; }

        /* REPORT */
        #report-view { display: none; color: black; font-family: 'Segoe UI', serif; }
        .report-header { text-align: center; border-bottom: 2px solid black; margin-bottom: 20px; padding-bottom: 10px; display: flex; align-items: center; justify-content: center; gap: 20px; }
        .report-table { width: 100%; border-collapse: collapse; margin-top: 20px; font-size: 12px; }
        .report-table th, .report-table td { border: 1px solid #ddd; padding: 8px; text-align: right; }
        .report-table th { background-color: #f2f2f2; }

        /* Tooltips */
        [title] { position: relative; }
    </style>
</head>
<body>

    <div id="report-view">
        <div class="report-header">
            <img src="logo.jpg" style="height: 80px;" onerror="this.src='logo.jpg.png'">
            <div>
                <h2>דוח תחקיר אירוע - מגמת יער ושטחים פתוחים</h2>
                <h4 id="rep-date"></h4>
            </div>
        </div>
        <div class="alert alert-info">תמונת מצב נכונה לשעת הפקת הדוח.</div>
        <h3>יומן מבצעים מלא:</h3>
        <table class="report-table">
            <thead><tr><th>שעה</th><th>תפקיד</th><th>שם</th><th>דיווח/פעולה</th></tr></thead>
            <tbody id="rep-table-body"></tbody>
        </table>
    </div>

    <div id="login-overlay" style="position:fixed; top:0; left:0; width:100%; height:100%; background:#2c3e50; z-index:9999; display:flex; align-items:center; justify-content:center;">
        <div class="bg-white p-4 rounded shadow text-center" style="width:500px;">
            <h2 class="text-danger mb-4">מערכת שו"ב - כניסה V32</h2>
            <div class="row g-2 mb-3">
                <div class="col-4"><button class="btn btn-outline-dark w-100 py-3" onclick="setRole('admin',this)">מנהלת</button></div>
                <div class="col-4"><button class="btn btn-outline-dark w-100 py-3" onclick="setRole('ic',this)">מפקד אירוע</button></div>
                <div class="col-4"><button class="btn btn-outline-dark w-100 py-3" onclick="setRole('sector',this)">מפקד גזרה</button></div>
            </div>
            <select id="sector-sel" class="form-select mb-3 text-center" style="display:none;">
                <option value="א">גזרה א'</option><option value="ב">גזרה ב'</option>
                <option value="ג">גזרה ג'</option><option value="ד">גזרה ד'</option>
            </select>
            <input type="text" id="username" class="form-control mb-3 text-center" placeholder="שם מלא (לתחקיר)">
            <input type="text" id="game-id" class="form-control mb-4 text-center" value="drill_v32">
            <button class="btn btn-danger w-100 fw-bold" onclick="login()">התחבר</button>
        </div>
    </div>

    <div id="top-bar">
        <div class="header-section">
            <div class="logo-box">
                <img src="logo.jpg" onerror="this.src='logo.jpg.png'">
            </div>
            <div class="player-panel">
                <div class="compass-wrap">
                    <i class="fa-regular fa-compass compass-icon" id="compass-arrow"></i>
                    <div class="compass-text" id="compass-val">0°</div>
                </div>
                <div class="meteo-info">
                    <div><i class="fa-solid fa-wind"></i> <span id="val-wind">0</span> קמ"ש</div>
                    <div class="text-muted" style="font-size:0.75em"><i class="fa-solid fa-temperature-half"></i> <span id="val-temp">25</span>°C</div>
                </div>
            </div>
            <span id="user-badge" class="badge bg-secondary">אורח</span>
        </div>
        
        <div class="header-section text-center">
            <div class="small text-white-50">זמן מבצעי (x10)</div>
            <div id="clock-display" class="clock-display">T+00:00</div>
        </div>
        
        <div class="header-section">
            <button class="btn btn-sm btn-outline-warning" onclick="togglePrediction()">
                <i class="fa-solid fa-stopwatch"></i> חיזוי אש
            </button>
            <button class="btn btn-sm btn-outline-light" onclick="generateReport()">
                <i class="fa-solid fa-print"></i> דוח
            </button>
        </div>
    </div>

    <div id="main-container">
        <div id="map">
            
            <div class="draggable-panel" id="p-admin" style="top:20px; right:20px; display:none;">
                <div class="panel-handle">מנהלת</div>
                <div class="tool-grid">
                    <button class="btn-tool" onclick="setTool('fire',event)" title="נקודת התחלה - אש חדשה"><i class="fa-solid fa-fire text-danger"></i> הצתת אש</button>
                    <button class="btn-tool" onclick="editMeteo()" title="שינוי רוח וטמפרטורה"><i class="fa-solid fa-cloud"></i> מזג אוויר</button>
                    <button class="btn-tool" onclick="setTool('water',event)" title="מקור מים רגיל (לסער/אשד)"><i class="fa-solid fa-droplet text-primary"></i> מים</button>
                    <button class="btn-tool" onclick="setTool('pool',event)" title="בריכת מילוי למסוק"><i class="fa-solid fa-water text-info"></i> בריכת מילוי</button>
                    <button class="btn-tool" onclick="setTool('plane_red',event)" title="שפיכת מעכב מהאוויר"><i class="fa-solid fa-plane text-danger"></i> מטוס מעכב</button>
                    <button class="btn-tool" onclick="setTool('plane_blue',event)" title="שפיכת מים מהאוויר"><i class="fa-solid fa-plane text-primary"></i> מטוס מים</button>
                    <button class="btn-tool" onclick="resetAll()"><i class="fa-solid fa-trash"></i> איפוס הכל</button>
                </div>
            </div>

            <div class="draggable-panel" id="p-ic" style="top:20px; right:120px; display:none;">
                <div class="panel-handle">מפקד אירוע</div>
                <div class="tool-grid">
                    <button class="btn-tool" onclick="setTool('cp',event)" title="הצבת חפ''ק (מפקדה קדמית)"><i class="fa-solid fa-flag text-danger"></i> חפ"ק</button>
                    <button class="btn-tool" onclick="setTool('staging',event)" title="שטח כינוס (Staging Area)"><i class="fa-solid fa-circle-h text-danger"></i> שט"כ</button>
                    <button class="btn-tool" onclick="setTool('sector_draw',event)" title="שרטוט גזרה - דאבל קליק לסיום"><i class="fa-solid fa-draw-polygon text-warning"></i> שרטוט גזרה</button>
                    <button class="btn-tool" onclick="setTool('delete_sector',event)" title="מחיקת גזרה קיימת"><i class="fa-solid fa-eraser"></i> מחק גזרה</button>
                    <button class="btn-tool" onclick="openBankIC()" title="הקצאת כוחות שאושרו לגזרות"><i class="fa-solid fa-users-gear"></i> הקצאת כוחות</button>
                    <hr style="margin:2px">
                    <button class="btn-tool" onclick="setTool('sym_risk',event)" title="סימון סיכון מיוחד"><i class="fa-solid fa-caret-down text-success"></i> סיכון מיוחד</button>
                    <button class="btn-tool" onclick="setTool('sym_defense',event)" title="נקודה להגנה קריטית"><i class="fa-solid fa-certificate"></i> הגנה קריטית</button>
                    <button class="btn-tool" onclick="setTool('arrow',event)" title="חץ כיוון תקיפה"><i class="fa-solid fa-arrow-right text-danger"></i> חץ תקיפה</button>
                    <button class="btn-tool" onclick="setTool('route',event)" title="נתיב נסיעה - דאבל קליק לסיום"><i class="fa-solid fa-route"></i> נתיב נסיעה</button>
                </div>
            </div>

            <div class="draggable-panel" id="p-sector" style="bottom:20px; right:20px; display:none;">
                <div class="panel-handle">מפקד גזרה</div>
                <div class="tool-grid" id="sector-tools">
                    <!-- Smart buttons will be generated here -->
                </div>
            </div>

        </div>

        <div id="sidebar">
            <div class="sb-header">יומן מבצעים</div>
            <div id="log-container"></div>
            <div class="sb-header bg-warning bg-opacity-10 text-dark small">בקשות ואישורים</div>
            <div id="requests-container"></div>
            <div id="chat-box" style="padding:5px;">
                <div class="input-group">
                    <input type="text" id="chat-in" class="form-control" placeholder="פקודה... (רווח לדיבור)">
                    <button class="btn btn-primary" onclick="sendChat()">></button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, set, onValue, push, update, remove, get } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        const firebaseConfig = { apiKey: "AIzaSyAprkTQI8h7ngt186yQSeYuBR37J7jjQBs", authDomain: "firesim2026.firebaseapp.com", databaseURL: "https://firesim2026-default-rtdb.firebaseio.com", projectId: "firesim2026", storageBucket: "firesim2026.firebasestorage.app", messagingSenderId: "816221488429", appId: "1:816221488429:web:8422845f75f8656d2abfa4", measurementId: "G-P77FYQT1C7" };
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // --- GLOBAL STATE ---
        let map, layers={};
        let myRole=null, myName="", mySector=null;
        let activeTool=null, selectedUnitKey=null;
        let polyPoints=[], dragStart=null, tempLine=null;
        let gameState = { start: Date.now(), wind:10, windDir:0, temp:25, lastWindChange: Date.now() };
        let showPrediction = false;
        const TIME_FACTOR = 10;
        const GAME_ID = "drill_v32";
        
        // Smart buttons state
        let sectorAvailableUnits = {};
        
        // --- LOGIN & SETUP ---
        window.setRole = (r, el) => {
            document.querySelectorAll('.btn-outline-dark').forEach(b=>b.classList.remove('active'));
            el.classList.add('active');
            myRole = r;
            document.getElementById('sector-sel').style.display = (r==='sector')?'block':'none';
        };

        window.login = () => {
            if(!myRole) return alert("בחר תפקיד");
            myName = document.getElementById('username').value || "User";
            if(myRole==='sector') mySector = document.getElementById('sector-sel').value;
            
            document.getElementById('login-overlay').style.display='none';
            document.getElementById('user-badge').innerText = `${myName}`;
            logSys(`התחבר למערכת (${getRoleName()})`);

            // Setup Panels
            if(myRole==='admin') { document.getElementById('p-admin').style.display='flex'; document.getElementById('p-ic').style.display='flex'; }
            if(myRole==='ic') { document.getElementById('p-ic').style.display='flex'; }
            if(myRole==='sector') { 
                document.getElementById('p-sector').style.display='flex'; 
                initSectorButtons();
            }

            makeDraggable();
            setTimeout(() => { initMap(); syncData(); setInterval(gameLoop, 1000); }, 500);
        };

        function getRoleName() { return myRole==='admin'?'מנהלת':(myRole==='ic'?'מפקד אירוע':`מפקד גזרה ${mySector}`); }

        function makeDraggable() {
            document.querySelectorAll('.draggable-panel').forEach(elm => {
                let h = elm.querySelector('.panel-handle');
                h.onmousedown = e => {
                    e.preventDefault(); let x=e.clientX, y=e.clientY;
                    document.onmousemove = e => { e.preventDefault(); elm.style.top=(elm.offsetTop-(y-e.clientY))+"px"; elm.style.left=(elm.offsetLeft-(x-e.clientX))+"px"; x=e.clientX; y=e.clientY; };
                    document.onmouseup = () => { document.onmousemove=null; };
                };
            });
        }

        // --- SMART BUTTONS SYSTEM (V32 FIX #2) ---
        function initSectorButtons() {
            const types = ['saar', 'eshed', 'heli', 'D9'];
            const icons = {
                'saar': '🚒',
                'eshed': '🚛', 
                'heli': '🚁',
                'D9': '🚜'
            };
            const container = document.getElementById('sector-tools');
            
            types.forEach(type => {
                const btn = document.createElement('button');
                btn.className = 'btn-tool smart-btn';
                btn.id = `smart-${type}`;
                btn.dataset.type = type;
                btn.innerHTML = `${icons[type]} <span id="label-${type}">בקש ${type}</span>`;
                btn.title = `בקש ${type} - יופיע כאן לאחר אישור`;
                btn.onclick = (e) => handleSmartButton(type, e);
                container.appendChild(btn);
            });

            // Movement button
            const moveBtn = document.createElement('button');
            moveBtn.className = 'btn-tool';
            moveBtn.innerHTML = '<i class="fa-solid fa-up-down-left-right text-primary"></i> הזזת כוח';
            moveBtn.title = 'העברת כוח למיקום חדש';
            moveBtn.onclick = (e) => { e.stopPropagation(); moveUnit(); };
            container.appendChild(moveBtn);
        }

        function handleSmartButton(type, e) {
            e.stopPropagation();
            const available = sectorAvailableUnits[type];
            
            if (available && available.length > 0) {
                // MODE: Place unit
                const tokenKey = available[0]; // Take first available
                selectedUnitKey = tokenKey;
                activeTool = 'place_unit';
                document.getElementById('map').style.cursor = 'crosshair';
                alert(`${type} מוכן להצבה. לחץ על המפה.`);
            } else {
                // MODE: Request
                requestResource(type);
            }
        }

        function updateSmartButtons() {
            if (myRole !== 'sector') return;
            
            const types = ['saar', 'eshed', 'heli', 'D9'];
            types.forEach(type => {
                const btn = document.getElementById(`smart-${type}`);
                const label = document.getElementById(`label-${type}`);
                const available = sectorAvailableUnits[type];
                
                if (available && available.length > 0) {
                    btn.classList.add('available');
                    label.textContent = `הצב ${type} (${available.length})`;
                } else {
                    btn.classList.remove('available');
                    label.textContent = `בקש ${type}`;
                }
            });
        }

        // --- MAP ENGINE ---
        function initMap() {
            map = L.map('map', {doubleClickZoom:false}).setView([32.73, 35.03], 14);
            L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}').addTo(map);
            
            // Layer Groups
            layers.burnt = L.layerGroup().addTo(map);
            layers.fire = L.layerGroup().addTo(map);
            layers.pred = L.layerGroup().addTo(map);
            layers.polys = L.layerGroup().addTo(map);
            layers.units = L.layerGroup().addTo(map);
            layers.drawings = L.layerGroup().addTo(map);
            layers.markers = L.layerGroup().addTo(map);

            map.on('click', onMapClick);
            map.on('dblclick', onMapDblClick);
            map.on('mousedown', onMouseDown);
            map.on('mousemove', onMouseMove);
            map.on('mouseup', onMouseUp);
            setTimeout(()=>map.invalidateSize(), 500);
        }

        // --- INTERACTION ---
        function onMapClick(e) {
            let loc = e.latlng;
            
            if(activeTool==='sector_draw' || activeTool==='route') {
                polyPoints.push(loc);
                L.marker(loc,{icon:L.divIcon({className:'bg-dark rounded-circle', iconSize:[5,5]})}).addTo(layers.drawings);
                return;
            }

            // V32 FIX: Proper token handling
            if(activeTool==='place_unit' && selectedUnitKey) { 
                placeUnitFromToken(selectedUnitKey, loc);
                return;
            }
            
            if(activeTool==='delete_sector') {
                let name = prompt("הכנס אות גזרה למחיקה (א/ב...):");
                if(name) { deleteSector(name); }
                resetTool(); return;
            }

            if(activeTool==='move_dest' && selectedUnitKey) {
                update(ref(db, `games/${GAME_ID}/units/${selectedUnitKey}`), { destLat:loc.lat, destLng:loc.lng, status:'moving' });
                logSys("פקודת תנועה");
                activeTool='move_select'; selectedUnitKey=null;
                return;
            }

            if(!activeTool) return;

            // V32 FIX: Fire with wind direction snapshot
            if(activeTool==='fire') {

        // --- V32 FIX #3: DYNAMIC FIRE PHYSICS ---
        
        function drawFireNodes(fireNodes, gt) {
            if (!fireNodes) return;
            
            Object.entries(fireNodes).forEach(([nodeId, node]) => {
                if (!node.active) {
                    // Draw burnt area only
                    drawBurntArea(node, gt);
                    return;
                }
                
                let elapsed = (gt - node.start) / 1000; // seconds
                let speed = node.windSpeed * 30; // m/h
                let length = 50 + (speed * (elapsed / 3600));
                
                // Origin star
                L.marker([node.lat, node.lng], {
                    icon: L.divIcon({
                        html: '<i class="fa-solid fa-star text-danger fs-6"></i>',
                        className: ''
                    })
                }).addTo(layers.burnt);

                if (elapsed > 60) {
                    let windRad = (node.windDir - 90) * (Math.PI / 180);
                    let spread = 0.6;
                    let latOff = length / 111111;
                    
                    let p1 = [node.lat + latOff * Math.sin(windRad - spread), node.lng + latOff * Math.cos(windRad - spread)];
                    let p2 = [node.lat + latOff * Math.sin(windRad + spread), node.lng + latOff * Math.cos(windRad + spread)];
                    
                    // Burnt area
                    L.polygon([[node.lat, node.lng], p1, p2], {
                        stroke: false,
                        fillColor: '#2c3e50',
                        fillOpacity: 0.6
                    }).addTo(layers.burnt);
                    
                    // Active front
                    let level = Math.min(6, Math.floor(elapsed / 600) + 1);
                    L.polyline([p1, p2], {
                        color: getFireColor(level),
                        weight: 4
                    }).addTo(layers.fire);

                    // Prediction
                    if (showPrediction) {
                        drawPrediction(node, length, speed, windRad, spread);
                    }
                }
            });
        }

        function drawBurntArea(node, gt) {
            // Static burnt polygon for deactivated nodes
            let elapsed = (gt - node.deactivatedAt) / 1000;
            let speed = node.windSpeed * 30;
            let length = 50 + (speed * (elapsed / 3600));
            
            let windRad = (node.windDir - 90) * (Math.PI / 180);
            let spread = 0.6;
            let latOff = length / 111111;
            
            let p1 = [node.lat + latOff * Math.sin(windRad - spread), node.lng + latOff * Math.cos(windRad - spread)];
            let p2 = [node.lat + latOff * Math.sin(windRad + spread), node.lng + latOff * Math.cos(windRad + spread)];
            
            L.polygon([[node.lat, node.lng], p1, p2], {
                stroke: false,
                fillColor: '#2c3e50',
                fillOpacity: 0.8
            }).addTo(layers.burnt);
        }

        function drawPrediction(node, currentLen, speed, rad, spread) {
            for(let i=1; i<=4; i++) {
                let timeHours = i * 0.5;
                let predLen = currentLen + (speed * timeHours);
                let pLatOff = predLen / 111111;
                
                let pp1 = [node.lat + pLatOff * Math.sin(rad-spread), node.lng + pLatOff * Math.cos(rad-spread)];
                let pp2 = [node.lat + pLatOff * Math.sin(rad+spread), node.lng + pLatOff * Math.cos(rad+spread)];
                
                L.polyline([pp1, pp2], {color:'#f1c40f', dashArray:'10,10', weight:2}).addTo(layers.pred);
                if(i===4) L.marker(pp2, {icon:L.divIcon({className:'pred-label', html:'T+2h', iconSize:[30,10]})}).addTo(layers.pred);
            }
        }

        function getFireColor(lvl) {
            let cols = ['gray','gray','yellow','orange','orangered','red','purple'];
            return cols[lvl] || 'red';
        }

        // --- V32 FIX #4: HELICOPTER LOGIC ---
        
        function updateHelicopters(units, gt) {
            if (!units) return;
            
            // Find all helicopters and water sources
            let helis = [];
            let waterSources = [];
            let fires = [];
            
            Object.entries(units).forEach(([key, obj]) => {
                if (obj.type === 'unit' && obj.sub === 'heli') {
                    helis.push({key, ...obj});
                }
                if (obj.type === 'marker' && (obj.sub === 'pool' || obj.sub === 'water')) {
                    waterSources.push(obj);
                }
            });
            
            // Get active fire fronts
            get(ref(db, `games/${GAME_ID}/fire_nodes`)).then(snapshot => {
                const fireNodes = snapshot.val();
                if (fireNodes) {
                    Object.values(fireNodes).forEach(node => {
                        if (node.active) fires.push(node);
                    });
                }
                
                // Update each helicopter
                helis.forEach(heli => {
                    let nearWater = false;
                    let nearFire = false;
                    const WATER_RANGE = 2000; // 2km
                    
                    // Check distance to water
                    waterSources.forEach(water => {
                        let dist = map.distance([heli.lat, heli.lng], [water.lat, water.lng]);
                        if (dist <= WATER_RANGE) nearWater = true;
                    });
                    
                    // Check distance to fire
                    fires.forEach(fire => {
                        let dist = map.distance([heli.lat, heli.lng], [fire.lat, fire.lng]);
                        if (dist <= WATER_RANGE) nearFire = true;
                    });
                    
                    // Update status
                    let newStatus = (nearWater && nearFire) ? 'active' : 'inactive';
                    if (heli.heliStatus !== newStatus) {
                        update(ref(db, `games/${GAME_ID}/units/${heli.key}`), {
                            heliStatus: newStatus
                        });
                    }
                });
            });
        }

        // --- RENDER ---
        function syncData() {
            onValue(ref(db, `games/${GAME_ID}/state`), s => {
                let v = s.val();
                if(v) { 
                    let oldWindDir = gameState.windDir;
                    gameState={...gameState,...v}; 
                    
                    // V32: Detect wind change
                    if (oldWindDir !== gameState.windDir && myRole === 'admin') {
                        handleWindChange();
                    }
                    
                    document.getElementById('val-wind').innerText=gameState.wind;
                    document.getElementById('val-temp').innerText=gameState.temp;
                    document.getElementById('compass-arrow').style.transform = `rotate(${gameState.windDir}deg)`;
                    document.getElementById('compass-val').innerText = gameState.windDir+"°";
                }
                else if(myRole==='admin') set(ref(db, `games/${GAME_ID}/state`), gameState);
            });

            // V32: Fire nodes instead of units
            onValue(ref(db, `games/${GAME_ID}/fire_nodes`), s => {
                layers.fire.clearLayers(); 
                layers.burnt.clearLayers(); 
                layers.pred.clearLayers();
                
                let gt = getGameTime();
                drawFireNodes(s.val(), gt);
            });

            onValue(ref(db, `games/${GAME_ID}/units`), s => {
                layers.units.clearLayers(); 
                layers.polys.clearLayers(); 
                layers.drawings.clearLayers(); 
                layers.markers.clearLayers();
                
                let data = s.val();
                if(!data) return;
                let gt = getGameTime();

                Object.entries(data).forEach(([k,o]) => {
                    if(o.type==='sector') {
                        L.polygon(o.points, {color:'orange', fillOpacity:0.1, dashArray:'5,5'}).addTo(layers.polys).bindTooltip(`גזרה ${o.name}`,{permanent:true, direction:"center"});
                    }
                    else if(o.type==='unit') {
                        if(myRole==='sector' && o.sector!==mySector) return; 
                        let pos = (o.status==='moving' && o.destLat) ? [o.destLat,o.destLng] : [o.lat,o.lng];
                        let html = "";
                        
                        if(o.sub==='heli') {
                            let inactive = o.heliStatus === 'inactive' ? ' inactive' : '';
                            html = `<div class="unit-heli${inactive}"><i class="fa-solid fa-helicopter"></i></div>`;
                        } else {
                            let cls = o.sub=='saar'?'unit-saar':'unit-eshed';
                            html = `<div class="icon-unit ${cls}">${o.callSign}<div class="unit-water-fill" style="width:${o.water}%"></div></div>`;
                        }
                        
                        let m = L.marker(pos, {icon:L.divIcon({html:html,className:''})}).addTo(layers.units);
                        m.on('click', () => { 
                            if(activeTool==='move_select') { 
                                if(myRole==='sector' && o.sector!==mySector) return alert("לא בגזרה שלך");
                                selectedUnitKey=k; 
                                activeTool='move_dest'; 
                                document.getElementById('map').style.cursor='crosshair'; 
                            }
                        });
                    }
                    else if(o.type==='drawing') {
                        if(o.sub==='dozer') {
                            let ready = gt > (o.start + o.duration);
                            let col = ready ? 'black' : 'gray';
                            let dash = ready ? null : '5,10';
                            L.polyline([o.p1,o.p2], {color:col, weight:6, dashArray:dash}).addTo(layers.drawings);
                        } else if(o.sub==='arrow') {
                             L.polyline([o.p1,o.p2], {color:'red', weight:4}).addTo(layers.drawings);
                             L.marker(o.p2, {icon:L.divIcon({className:'', html:'<i class="fa-solid fa-caret-up text-danger fs-3"></i>'})}).addTo(layers.drawings);
                        } else if(o.sub==='route') {
                            L.polyline(o.points, {color:'black', dashArray:'2,5', weight:3}).addTo(layers.drawings);
                        } else {
                            let c = o.sub.includes('blue')?'blue':'red';
                            L.polyline([o.p1,o.p2], {color:c, weight:8, opacity:0.6}).addTo(layers.drawings);
                        }
                    }
                    else if(o.type==='marker') {
                        let html = "";
                        if(o.sub==='cp') html='<i class="fa-solid fa-flag text-danger fs-1"></i>';
                        if(o.sub==='staging') html='<div class="icon-staging text-danger fw-bold border border-danger rounded-circle p-1 bg-white">S</div>';
                        if(o.sub==='water') html='<i class="fa-solid fa-circle text-primary fs-4"></i>';
                        if(o.sub==='pool') html='<span class="fa-stack"><i class="fa-solid fa-circle text-primary fa-stack-2x"></i><i class="fa-solid fa-slash text-white fa-stack-1x"></i></span>';
                        if(o.sub==='sym_risk') html='<div class="sym-risk">▼</div>';
                        if(o.sub==='sym_defense') html='<div class="sym-defense"></div>';

                        L.marker([o.lat,o.lng], {icon:L.divIcon({html:html, className:''})}).addTo(layers.markers);
                    }
                });
                
                // Update helicopters every render
                updateHelicopters(data, gt);
            });

            onValue(ref(db, `games/${GAME_ID}/requests`), s => {
                let d = document.getElementById('requests-container'); 
                d.innerHTML="";
                
                if(s.val()) {
                    Object.entries(s.val()).forEach(([k,v]) => {
                        let show = false;
                        let actions = '';
                        
                        if (myRole === 'ic' && v.status === 'pending_ic') {
                            show = true;
                            actions = `<button class="btn btn-sm btn-success p-0 px-2" onclick="approveRequestIC('${k}', ${JSON.stringify(v).replace(/"/g, '&quot;')})">אשר ל-מנהלת</button>`;
                        }
                        
                        if (myRole === 'admin' && v.status === 'pending_admin') {
                            show = true;
                            actions = `<button class="btn btn-sm btn-danger p-0 px-2" onclick="approveRequestAdmin('${k}', ${JSON.stringify(v).replace(/"/g, '&quot;')})">אשר סופי</button>`;
                        }
                        
                        if (show) {
                            let cardClass = v.status === 'pending_admin' ? 'req-card pending-admin' : 'req-card';
                            d.innerHTML += `<div class="${cardClass}">
                                <span><b>${v.sector || v.by}</b>: ${v.type} <small class="text-muted">(${v.status.replace('pending_','')})</small></span>
                                ${actions}
                            </div>`;
                        }
                    });
                }
            });
            
            // V32: Monitor sector staging for smart buttons
            if (myRole === 'sector') {
                onValue(ref(db, `games/${GAME_ID}/sector_staging`), s => {
                    sectorAvailableUnits = { saar: [], eshed: [], heli: [], D9: [] };
                    
                    if (s.val()) {
                        Object.entries(s.val()).forEach(([key, item]) => {
                            if (item.sector === mySector && item.status === 'available') {
                                if (!sectorAvailableUnits[item.type]) sectorAvailableUnits[item.type] = [];
                                sectorAvailableUnits[item.type].push(key);
                            }
                        });
                    }
                    
                    updateSmartButtons();
                });
            }
            
            onValue(ref(db, `games/${GAME_ID}/logs`), s => {
                let d = document.getElementById('log-container'); d.innerHTML="";
                let tBody = document.getElementById('rep-table-body'); tBody.innerHTML="";
                if(s.val()) Object.values(s.val()).forEach(l => {
                    let t = new Date(l.time).toLocaleTimeString('he-IL',{hour:'2-digit',minute:'2-digit'});
                    d.innerHTML += `<div class="log-row"><span class="log-time">${t}</span><span class="log-role">${l.user}</span><span class="log-msg">${l.text}</span></div>`;
                    tBody.innerHTML += `<tr><td>${t}</td><td>${l.role}</td><td>${l.user}</td><td>${l.text}</td></tr>`;
                });
                d.scrollTop=d.scrollHeight;
            });
        }

        // V32: Handle wind direction change
        function handleWindChange() {
            get(ref(db, `games/${GAME_ID}/fire_nodes`)).then(snapshot => {
                const nodes = snapshot.val();
                if (!nodes) return;
                
                const gt = getGameTime();
                const updates = {};
                
                Object.entries(nodes).forEach(([key, node]) => {
                    if (node.active) {
                        // Deactivate old node
                        updates[`${key}/active`] = false;
                        updates[`${key}/deactivatedAt`] = gt;
                        
                        // Create new node at current front position
                        let elapsed = (gt - node.start) / 1000;
                        let speed = node.windSpeed * 30;
                        let length = 50 + (speed * (elapsed / 3600));
                        let windRad = (node.windDir - 90) * (Math.PI / 180);
                        let latOff = length / 111111;
                        
                        // New position at front center
                        let newLat = node.lat + latOff * Math.sin(windRad);
                        let newLng = node.lng + latOff * Math.cos(windRad);
                        
                        push(ref(db, `games/${GAME_ID}/fire_nodes`), {
                            lat: newLat,
                            lng: newLng,
                            start: gt,
                            windDir: gameState.windDir,
                            windSpeed: gameState.wind,
                            active: true,
                            parent: key
                        });
                    }
                });
                
                update(ref(db, `games/${GAME_ID}/fire_nodes`), updates);
                logSys(`שינוי רוח ל-${gameState.windDir}° - נוצרו חזיתות חדשות`);
            });
        }

        document.body.onkeydown = (e) => { 
            if(e.code==='Space' && document.activeElement.tagName!=='INPUT') {
                e.preventDefault();
                document.getElementById('chat-in').focus(); 
            }
        };

        function getGameTime() { return Date.now() + ((Date.now() - gameState.start) * (TIME_FACTOR - 1)); }
        
        function gameLoop() {
            let gt = getGameTime();
            let totalMin = Math.floor((gt - gameState.start) / 60000);
            let hours = Math.floor(totalMin / 60);
            let mins = totalMin % 60;
            document.getElementById('clock-display').innerText = `T+${hours}:${String(mins).padStart(2,'0')}`;
        }
    </script>
</body>
</html>
