<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>סימולטור פו"ש- מגמת יער ושטחים פתוחים - V30 (Master)</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* --- LAYOUT & PRINT --- */
        body { margin: 0; height: 100vh; overflow: hidden; font-family: 'Segoe UI', sans-serif; background: #2c3e50; display: flex; flex-direction: column; }
        
        @media print {
            body * { visibility: hidden; }
            #report-view, #report-view * { visibility: visible; }
            #report-view { position: absolute; left: 0; top: 0; width: 100%; height: 100%; background: white; z-index: 99999; padding: 20px; }
            .no-print { display: none !important; }
        }

        /* HEADER */
        #top-bar { 
            height: 70px; background: #1a1a1a; color: white; display: flex; align-items: center; 
            justify-content: space-between; padding: 0 15px; border-bottom: 4px solid #e67e22; z-index: 2000; flex-shrink: 0;
        }
        .header-section { display: flex; align-items: center; gap: 15px; }
        .logo-box { width: 50px; height: 50px; background: white; border-radius: 50%; overflow: hidden; display: flex; align-items: center; justify-content: center; border: 2px solid #ccc; }
        .logo-box img { width: 100%; height: 100%; object-fit: contain; }
        .meteo-badge { background: #34495e; padding: 4px 10px; border-radius: 4px; border: 1px solid #7f8c8d; font-size: 0.85rem; text-align: center; }
        .clock-display { font-family: monospace; font-size: 1.5rem; font-weight: bold; color: #f1c40f; text-shadow: 1px 1px 2px black; }

        /* MAIN CONTENT */
        #main-container { display: flex; flex: 1; height: calc(100% - 70px); position: relative; }
        #map { flex: 1; background: #333; position: relative; z-index: 1; }

        /* SIDEBAR */
        #sidebar { 
            width: 350px; background: #f8f9fa; border-right: 2px solid #ccc; z-index: 1500; 
            display: flex; flex-direction: column; height: 100%;
        }
        .sb-header { padding: 10px; background: #e9ecef; font-weight: bold; border-bottom: 1px solid #bdc3c7; }
        #log-container { flex: 2; overflow-y: auto; background: white; padding: 5px; font-size: 0.85rem; border-bottom: 2px solid #bdc3c7; }
        .log-row { padding: 4px 0; border-bottom: 1px solid #eee; display: flex; gap: 5px; }
        .log-time { color: #7f8c8d; min-width: 45px; font-size: 0.75rem; }
        .log-role { font-weight: bold; color: #2980b9; font-size: 0.75rem; min-width: 80px; }
        
        #requests-container { flex: 1; overflow-y: auto; background: #fff3cd; padding: 5px; }
        .req-card { background: white; border: 1px solid #f39c12; padding: 8px; margin-bottom: 5px; font-size: 0.85rem; border-radius: 4px; display: flex; justify-content: space-between; align-items: center; }

        #chat-box { padding: 10px; background: #ecf0f1; border-top: 1px solid #bdc3c7; }

        /* PANELS (Resizable & Draggable) */
        .draggable-panel { 
            position: absolute; background: rgba(255, 255, 255, 0.98); 
            border-radius: 6px; box-shadow: 0 8px 30px rgba(0,0,0,0.5); 
            z-index: 1000; min-width: 80px; display: flex; flex-direction: column; 
            border: 1px solid #95a5a6; overflow: hidden; resize: both;
        }
        .panel-handle { background: #2c3e50; height: 22px; cursor: move; width: 100%; display: flex; justify-content: center; align-items: center; }
        .panel-handle::after { content: '::::'; color: #95a5a6; letter-spacing: 2px; }
        .tool-grid { display: grid; grid-template-columns: 1fr; gap: 5px; padding: 5px; overflow-y: auto; }
        
        .btn-tool { width: 100%; height: 40px; border: 1px solid #bdc3c7; background: white; border-radius: 4px; cursor: pointer; transition: 0.1s; display: flex; align-items: center; justify-content: center; gap: 5px; font-weight: bold; font-size: 14px; }
        .btn-tool:hover { background: #ecf0f1; }
        .btn-tool.active { background: #3498db; color: white; border-color: #2980b9; }

        /* MAP ICONS */
        .icon-unit { background: white; border: 2px solid black; display: flex; justify-content: center; align-items: center; font-weight: bold; font-size: 10px; position: relative; box-shadow: 2px 2px 4px rgba(0,0,0,0.5); }
        .unit-saar { width: 36px; height: 22px; border-color: #c0392b; color: #c0392b; }
        .unit-eshed { width: 46px; height: 26px; border-color: #8e44ad; color: #8e44ad; }
        .unit-water { position: absolute; bottom: 0; left: 0; width: 100%; height: 3px; background: #ccc; }
        .unit-water-fill { height: 100%; background: #3498db; }

        /* FIRE LEVELS COLORS */
        .fire-lvl-1 { stroke: gray; } .fire-lvl-2 { stroke: yellow; } .fire-lvl-3 { stroke: orange; }
        .fire-lvl-4 { stroke: #d35400; stroke-width: 3; } .fire-lvl-5 { stroke: red; stroke-width: 4; } 
        .fire-lvl-6 { stroke: purple; stroke-width: 5; stroke-dasharray: 5,5; }

        /* REPORT VIEW */
        #report-view { display: none; color: black; font-family: 'Segoe UI', serif; }
        .report-header { text-align: center; border-bottom: 2px solid black; margin-bottom: 20px; padding-bottom: 10px; display: flex; align-items: center; justify-content: center; gap: 20px; }
        .report-table { width: 100%; border-collapse: collapse; margin-top: 20px; font-size: 12px; }
        .report-table th, .report-table td { border: 1px solid #ddd; padding: 8px; text-align: right; }
        .report-table th { background-color: #f2f2f2; }
    </style>
</head>
<body>

    <div id="report-view">
        <div class="report-header">
            <img src="logo.jpg" style="height: 80px;">
            <div>
                <h2>דוח תחקיר אירוע - מגמת יער ושטחים פתוחים</h2>
                <h4 id="rep-date"></h4>
            </div>
        </div>
        <div class="alert alert-info">הערה: המפה היא תמונת מצב לרגע הפקת הדוח.</div>
        <h3>יומן אירועים:</h3>
        <table class="report-table">
            <thead><tr><th>שעה</th><th>תפקיד</th><th>שם המשתמש</th><th>פעולה/דיווח</th></tr></thead>
            <tbody id="rep-table-body"></tbody>
        </table>
    </div>

    <div id="login-overlay" style="position:fixed; top:0; left:0; width:100%; height:100%; background:#2c3e50; z-index:9999; display:flex; align-items:center; justify-content:center;">
        <div class="bg-white p-4 rounded shadow text-center" style="width:500px;">
            <h2 class="text-danger mb-4">מערכת שו"ב - כניסה</h2>
            <div class="row g-2 mb-3">
                <div class="col-4"><button class="btn btn-outline-dark w-100 py-3" onclick="setRole('admin',this)">מנהלת</button></div>
                <div class="col-4"><button class="btn btn-outline-dark w-100 py-3" onclick="setRole('ic',this)">מפקד אירוע</button></div>
                <div class="col-4"><button class="btn btn-outline-dark w-100 py-3" onclick="setRole('sector',this)">מפקד גזרה</button></div>
            </div>
            <select id="sector-sel" class="form-select mb-3 text-center" style="display:none;">
                <option value="א">גזרה א'</option><option value="ב">גזרה ב'</option>
                <option value="ג">גזרה ג'</option><option value="ד">גזרה ד'</option>
            </select>
            <input type="text" id="username" class="form-control mb-3 text-center" placeholder="שם מלא לתחקיר">
            <input type="text" id="game-id" class="form-control mb-4 text-center" value="drill_v30">
            <button class="btn btn-danger w-100 fw-bold" onclick="login()">התחבר</button>
        </div>
    </div>

    <div id="top-bar">
        <div class="header-section">
            <div class="logo-box">
                <img src="logo.jpg" onerror="this.src='data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAxMDAgMTAwIj48dGV4dCB4PSI1MCIgeT0iNTAiIGZvbnQtc2l6ZT0iMjAiIHRleHQtYW5jaG9yPSJtaWRkbGUiPkxPR088L3RleHQ+PC9zdmc+'">
            </div>
            <span id="user-badge" class="badge bg-secondary p-2">אורח</span>
            <div class="meteo-badge" id="meteo-data">
                <i class="fa-solid fa-wind"></i> <span id="val-wind">0</span> קמ"ש 
                (<span id="val-dir">0</span>°) | 
                <span id="val-temp">25</span>°C
            </div>
        </div>
        <div class="header-section text-center">
            <div class="small text-white-50">זמן מבצעי (x10)</div>
            <div id="clock-display" class="clock-display">T+00:00</div>
        </div>
        <div class="header-section">
            <button class="btn btn-sm btn-outline-light" onclick="generateReport()"><i class="fa-solid fa-print"></i> דוח</button>
        </div>
    </div>

    <div id="main-container">
        <div id="map">
            
            <div class="draggable-panel" id="p-admin" style="top:20px; right:20px; display:none;">
                <div class="panel-handle"></div>
                <div class="tool-grid">
                    <button class="btn-tool" onclick="setTool('fire',event)" title="הצתה"><i class="fa-solid fa-fire text-danger"></i> אש</button>
                    <button class="btn-tool" onclick="setTool('water',event)" title="מקור מים"><i class="fa-solid fa-droplet text-primary"></i> מים</button>
                    <button class="btn-tool" onclick="editMeteo()" title="מזג אוויר"><i class="fa-solid fa-cloud"></i> מזג אוויר</button>
                    <button class="btn-tool" onclick="addBank('saar')" title="+סער"><i class="fa-solid fa-plus"></i> סער</button>
                    <button class="btn-tool" onclick="addBank('eshed')" title="+אשד"><i class="fa-solid fa-plus"></i> אשד</button>
                    <button class="btn-tool" onclick="resetAll()"><i class="fa-solid fa-trash"></i> איפוס</button>
                </div>
            </div>

            <div class="draggable-panel" id="p-ic" style="top:20px; right:100px; display:none;">
                <div class="panel-handle"></div>
                <div class="tool-grid">
                    <button class="btn-tool" onclick="setTool('cp',event)"><i class="fa-solid fa-flag text-danger"></i> חפ"ק</button>
                    <button class="btn-tool" onclick="setTool('staging',event)"><i class="fa-solid fa-circle-h text-danger"></i> שט"כ</button>
                    <button class="btn-tool" onclick="setTool('sector_draw',event)"><i class="fa-solid fa-draw-polygon text-warning"></i> גזרה</button>
                    <button class="btn-tool" onclick="setTool('arrow',event)"><i class="fa-solid fa-arrow-right"></i> חץ</button>
                    <button class="btn-tool" onclick="openBankIC()" title="הקצאת כוחות"><i class="fa-solid fa-users-gear"></i> עתודה</button>
                </div>
            </div>

            <div class="draggable-panel" id="p-sector" style="bottom:20px; right:20px; display:none;">
                <div class="panel-handle"></div>
                <div class="tool-grid">
                    <button class="btn-tool" onclick="reqRes('saar')">בקש סער</button>
                    <button class="btn-tool" onclick="reqRes('eshed')">בקש אשד</button>
                    <button class="btn-tool" onclick="moveUnit(event)"><i class="fa-solid fa-up-down-left-right"></i> הזז</button>
                    <button class="btn-tool" onclick="reqD9()">בקש D9</button>
                    <button class="btn-tool" onclick="openStagingSector()"><i class="fa-solid fa-download"></i> הצב</button>
                </div>
            </div>

        </div>

        <div id="sidebar">
            <div class="sb-header">יומן מבצעים</div>
            <div id="log-container"></div>
            <div class="sb-header bg-warning bg-opacity-10 text-dark small">בקשות ואישורים</div>
            <div id="requests-container"></div>
            <div id="chat-box">
                <div class="input-group">
                    <input type="text" id="chat-in" class="form-control" placeholder="פקודה... (רווח לדיבור)">
                    <button class="btn btn-primary" onclick="sendChat()">></button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, set, onValue, push, update, remove, get } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        const firebaseConfig = { apiKey: "AIzaSyAprkTQI8h7ngt186yQSeYuBR37J7jjQBs", authDomain: "firesim2026.firebaseapp.com", databaseURL: "https://firesim2026-default-rtdb.firebaseio.com", projectId: "firesim2026", storageBucket: "firesim2026.firebasestorage.app", messagingSenderId: "816221488429", appId: "1:816221488429:web:8422845f75f8656d2abfa4", measurementId: "G-P77FYQT1C7" };
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // --- GLOBAL STATE ---
        let map, layers={};
        let myRole=null, myName="", mySector=null;
        let activeTool=null, selectedUnit=null;
        let polyPoints=[], dragStart=null, tempLine=null;
        let gameState = { start: Date.now(), wind:10, windDir:270, temp:25 };
        const TIME_FACTOR = 10;
        
        // --- LOGIN & SETUP ---
        window.setRole = (r, el) => {
            document.querySelectorAll('.btn-outline-dark').forEach(b=>b.classList.remove('active'));
            el.classList.add('active');
            myRole = r;
            document.getElementById('sector-sel').style.display = (r==='sector')?'block':'none';
        };

        window.login = () => {
            if(!myRole) return alert("בחר תפקיד");
            myName = document.getElementById('username').value || "User";
            if(myRole==='sector') mySector = document.getElementById('sector-sel').value;
            
            document.getElementById('login-overlay').style.display='none';
            document.getElementById('user-badge').innerText = `${myName} | ${getRoleName()}`;
            logSys(`התחבר למערכת`);

            // Setup Panels
            if(myRole==='admin') { document.getElementById('p-admin').style.display='flex'; document.getElementById('p-sector').style.display='flex'; }
            if(myRole==='ic') { document.getElementById('p-ic').style.display='flex'; document.getElementById('p-sector').style.display='flex'; }
            if(myRole==='sector') { document.getElementById('p-sector').style.display='flex'; }

            makeDraggable();
            setTimeout(() => { initMap(); syncData(); setInterval(gameLoop, 1000); }, 500);
        };

        function getRoleName() { return myRole==='admin'?'מנהלת':(myRole==='ic'?'מפקד אירוע':`מפקד גזרה ${mySector}`); }

        function makeDraggable() {
            document.querySelectorAll('.draggable-panel').forEach(elm => {
                let h = elm.querySelector('.panel-handle');
                h.onmousedown = e => {
                    e.preventDefault(); let x=e.clientX, y=e.clientY;
                    document.onmousemove = e => { e.preventDefault(); elm.style.top=(elm.offsetTop-(y-e.clientY))+"px"; elm.style.left=(elm.offsetLeft-(x-e.clientX))+"px"; x=e.clientX; y=e.clientY; };
                    document.onmouseup = () => { document.onmousemove=null; };
                };
            });
        }

        // --- MAP ENGINE ---
        function initMap() {
            map = L.map('map', {doubleClickZoom:false}).setView([32.73, 35.03], 14);
            L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}').addTo(map);
            L.tileLayer('https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png', {opacity: 0.4}).addTo(map);

            layers.fire = L.layerGroup().addTo(map);
            layers.polys = L.layerGroup().addTo(map);
            layers.units = L.layerGroup().addTo(map);
            layers.drawings = L.layerGroup().addTo(map);
            layers.markers = L.layerGroup().addTo(map);

            map.on('click', onMapClick);
            map.on('dblclick', onMapDblClick);
            map.on('mousedown', onMouseDown);
            map.on('mousemove', onMouseMove);
            map.on('mouseup', onMouseUp);
            setTimeout(()=>map.invalidateSize(), 500);
        }

        // --- INTERACTION ---
        function onMapClick(e) {
            let loc = e.latlng;
            
            // Draw Sector Points
            if(activeTool==='sector_draw') {
                polyPoints.push(loc);
                L.marker(loc,{icon:L.divIcon({className:'bg-warning rounded-circle', iconSize:[6,6]})}).addTo(layers.drawings);
                return;
            }

            // Place Unit from Staging
            if(activeTool==='place_unit' && selectedUnit) { // selectedUnit holds the Staging Key here
                placeUnit(selectedUnit, loc);
                return;
            }

            // Move Unit Destination
            if(activeTool==='move_dest' && selectedUnit) {
                update(ref(db, `games/drill_v30/units/${selectedUnit}`), { destLat:loc.lat, destLng:loc.lng, status:'moving' });
                logSys("פקודת תנועה");
                activeTool='move_select'; selectedUnit=null;
                return;
            }

            if(!activeTool) return;

            // Placements
            if(activeTool==='fire') { push(ref(db, `games/drill_v30/units`), {type:'fire', lat:loc.lat, lng:loc.lng, start:getGameTime(), level:1}); logSys("הצצת אש"); }
            if(activeTool==='cp') { push(ref(db, `games/drill_v30/units`), {type:'marker', sub:'cp', lat:loc.lat, lng:loc.lng}); logSys("חפק"); }
            if(activeTool==='staging') { push(ref(db, `games/drill_v30/units`), {type:'marker', sub:'staging', lat:loc.lat, lng:loc.lng}); logSys("שטח כינוס"); }
            if(activeTool==='water') { push(ref(db, `games/drill_v30/units`), {type:'marker', sub:'water', lat:loc.lat, lng:loc.lng}); }
            
            if(!['arrow','dozer','sector_draw'].includes(activeTool)) resetTool();
        }

        function onMapDblClick() {
            if(activeTool==='sector_draw' && polyPoints.length>2) {
                let name = prompt("שם הגזרה (א, ב...):");
                if(name) push(ref(db, `games/drill_v30/units`), {type:'sector', name:name, points:polyPoints});
                polyPoints=[]; resetTool();
            }
        }

        function onMouseDown(e) { if(['arrow','dozer'].includes(activeTool)) { map.dragging.disable(); dragStart=e.latlng; } }
        function onMouseMove(e) { 
            if(dragStart) { 
                if(tempLine) map.removeLayer(tempLine); 
                let c = activeTool==='dozer'?'black':'red';
                let txt = "";
                if(activeTool==='dozer') {
                    let dist = map.distance(dragStart, e.latlng);
                    // Speed 3000m/h -> 50m/min
                    let mins = Math.ceil(dist / 50);
                    txt = ` | ${Math.round(dist)}m (~${mins} דק')`;
                }
                tempLine = L.polyline([dragStart,e.latlng],{color:c, weight:4}).addTo(map).bindTooltip(activeTool+txt).openTooltip();
            } 
        }
        function onMouseUp(e) {
            if(dragStart) {
                let dist = map.distance(dragStart, e.latlng);
                if(activeTool==='dozer') {
                    // D9 Logic: 3km/h
                    let duration = (dist / 3000) * 3600000; // ms in game time
                    push(ref(db, `games/drill_v30/units`), {type:'drawing', sub:'dozer', p1:dragStart, p2:e.latlng, start:getGameTime(), duration:duration});
                    logSys(`תכנון קו חישוף ${Math.round(dist)}מ'`);
                } else {
                    push(ref(db, `games/drill_v30/units`), {type:'drawing', sub:'arrow', p1:dragStart, p2:e.latlng});
                }
                dragStart=null; map.dragging.enable(); if(tempLine) map.removeLayer(tempLine); resetTool();
            }
        }

        // --- BUSINESS LOGIC ---
        
        // Fire Physics (Fan Shape)
        function drawFire(obj, gt) {
            let el = (gt - obj.start)/1000; // seconds elapsed
            let speed = gameState.wind * 30; // m/h
            let length = 50 + (speed * (el/3600)); // meters growth
            
            // Star start
            L.marker([obj.lat,obj.lng],{icon:L.divIcon({html:'<i class="fa-solid fa-star text-danger fs-5"></i>',className:''})}).addTo(layers.fire);

            if(el > 60) { // After 1 min game time, fan starts
                let windRad = (gameState.windDir - 90) * (Math.PI / 180);
                let spread = 0.5; // Fan width
                let latOff = length / 111111;
                let p1 = [obj.lat + latOff * Math.sin(windRad-spread), obj.lng + latOff * Math.cos(windRad-spread)];
                let p2 = [obj.lat + latOff * Math.sin(windRad+spread), obj.lng + latOff * Math.cos(windRad+spread)];
                
                // Color by Level
                let cls = `fire-lvl-${obj.level}`;
                L.polygon([[obj.lat,obj.lng],p1,p2], {className: cls, color:'red', fillColor:'#e67e22', fillOpacity:0.5}).addTo(layers.fire);
                
                // Check Safety (Radius 70m)
                checkSafety(obj.lat, obj.lng, length, obj.level);
            }
        }

        function checkSafety(flat, flng, len, lvl) {
            if(lvl < 4) return;
            // Simple check: is any unit within fire range?
            // (Simplified geometry check for V30 performance)
            // Real intersection logic would go here.
        }

        // Bank & Assignment Logic
        window.openBankIC = async () => {
            const s = await get(ref(db, `games/drill_v30/bank`));
            let data = s.val();
            let html = "";
            if(data) Object.entries(data).forEach(([k,v]) => {
                html += `<div class="btn btn-outline-light w-100 mb-1 text-start" onclick="assignUnit('${k}','${v.type}')">🚛 ${v.type}</div>`;
            });
            let win = window.open("", "Bank", "width=300,height=400");
            win.document.write(`<html><body style="background:#333;color:white"><h3>בנק כוחות</h3>${html || 'ריק'}</body></html>`);
            // Note: Popup blocking might be an issue, better to use in-page modal. 
            // Reverting to Prompt for simplicity in V30 Master due to HTML limit
        };

        window.assignUnit = (k, type) => {
            let sector = prompt("לאיזה גזרה להקצות? (א/ב/ג...)");
            if(sector) {
                remove(ref(db, `games/drill_v30/bank/${k}`));
                push(ref(db, `games/drill_v30/sector_staging`), {type:type, sector:sector});
                logSys(`הקצאת ${type} לגזרה ${sector}`);
            }
        };

        // D9 Logic
        window.reqD9 = () => {
            if(myRole==='admin') return; 
            push(ref(db, `games/drill_v30/requests`), {type:'D9', by:getRoleName(), time:Date.now()});
            alert("בקשה נשלחה");
        };

        // --- RENDER ---
        function syncData() {
            onValue(ref(db, `games/drill_v30/state`), s => {
                let v = s.val();
                if(v) { gameState={...gameState,...v}; updateMeteoUI(); }
                else if(myRole==='admin') set(ref(db, `games/drill_v30/state`), gameState);
            });

            onValue(ref(db, `games/drill_v30/units`), s => {
                layers.fire.clearLayers(); layers.units.clearLayers(); layers.polys.clearLayers(); layers.drawings.clearLayers(); layers.markers.clearLayers();
                let data = s.val();
                if(!data) return;
                let gt = getGameTime();

                Object.entries(data).forEach(([k,o]) => {
                    if(o.type==='fire') drawFire(o, gt);
                    else if(o.type==='sector') {
                        L.polygon(o.points, {color:'orange', fillOpacity:0.1, dashArray:'5,5'}).addTo(layers.polys).bindTooltip(`גזרה ${o.name}`,{permanent:true, direction:"center"});
                    }
                    else if(o.type==='unit') {
                        if(myRole==='sector' && o.sector!==mySector) return; // Sector Isolation
                        let pos = (o.status==='moving' && o.destLat) ? [o.destLat,o.destLng] : [o.lat,o.lng];
                        let cls = o.sub=='saar'?'unit-saar':'unit-eshed';
                        let html = `<div class="icon-unit ${cls}">${o.callSign}<div class="unit-water"><div class="unit-water-fill" style="width:${o.water}%"></div></div></div>`;
                        let m = L.marker(pos, {icon:L.divIcon({html:html,className:''})}).addTo(layers.units);
                        m.on('click', () => { if(activeTool==='move_select') { 
                            if(myRole==='sector' && o.sector!==mySector) return alert("לא בגזרה שלך");
                            selectedUnit=k; activeTool='move_dest'; document.getElementById('map').style.cursor='crosshair'; 
                        }});
                    }
                    else if(o.type==='drawing') {
                        if(o.sub==='dozer') {
                            let ready = gt > (o.start + o.duration);
                            let col = ready ? 'black' : 'gray';
                            let dash = ready ? null : '5,10';
                            L.polyline([o.p1,o.p2], {color:col, weight:5, dashArray:dash}).addTo(layers.drawings);
                        } else {
                            L.polyline([o.p1,o.p2], {color:'red', weight:4}).addTo(layers.drawings);
                        }
                    }
                    else if(o.type==='marker') {
                        let html = o.sub==='cp'?'<i class="fa-solid fa-flag text-danger fs-2"></i>':(o.sub==='staging'?'<i class="fa-solid fa-circle-h text-danger fs-2"></i>':'<i class="fa-solid fa-droplet text-primary fs-3"></i>');
                        L.marker([o.lat,o.lng], {icon:L.divIcon({html:html, className:''})}).addTo(layers.markers);
                    }
                });
            });

            onValue(ref(db, `games/drill_v30/logs`), s => {
                let d = document.getElementById('log-container'); d.innerHTML="";
                let tBody = document.getElementById('rep-table-body'); tBody.innerHTML="";
                if(s.val()) Object.values(s.val()).forEach(l => {
                    let t = new Date(l.time).toLocaleTimeString('he-IL',{hour:'2-digit',minute:'2-digit'});
                    // Sidebar Log
                    d.innerHTML += `<div class="log-row"><span class="log-time">${t}</span><span class="log-role">${l.user}</span><span class="log-msg">${l.text}</span></div>`;
                    // Report Table
                    tBody.innerHTML += `<tr><td>${t}</td><td>${l.role}</td><td>${l.user}</td><td>${l.text}</td></tr>`;
                });
                d.scrollTop=d.scrollHeight;
            });
            
            // Requests
            onValue(ref(db, `games/drill_v30/requests`), s => {
                let d = document.getElementById('requests-container'); d.innerHTML="";
                if(s.val()) Object.entries(s.val()).forEach(([k,v]) => {
                    d.innerHTML += `<div class="req-card"><span>${v.by}: ${v.type}</span><div><button class="btn btn-sm btn-success p-0 px-2" onclick="approveReq('${k}','${v.type}')">V</button></div></div>`;
                });
            });
        }

        // --- UTILS ---
        window.setTool = (t,e) => { 
            if(e) e.stopPropagation(); 
            activeTool=t; 
            if(t!=='move_select') selectedUnit=null; 
            document.getElementById('map').style.cursor='crosshair';
        };
        window.resetTool = () => { activeTool=null; document.getElementById('map').style.cursor='grab'; };
        
        window.moveUnit = (e) => { 
            if(e) e.stopPropagation(); 
            activeTool='move_select'; document.getElementById('map').style.cursor='pointer'; alert("בחר רכב"); 
        };
        
        window.addBank = (type) => { push(ref(db, `games/drill_v30/bank`), {type:type}); logSys(`+${type} לבנק`); };
        
        window.openStagingSector = async () => {
            const s = await get(ref(db, `games/drill_v30/sector_staging`));
            let data = s.val();
            if(!data) return alert("אין כוחות זמינים להצבה");
            // Simple logic: Find first available for this sector (V30 simplification)
            let found = Object.entries(data).find(([k,v]) => v.sector === mySector);
            if(found) {
                selectedUnit = found[0]; // Key
                activeTool = 'place_unit';
                alert(`נבחר ${found[1].type}. לחץ במפה להצבה.`);
            } else {
                alert("אין כוחות לגזרה שלך");
            }
        };

        window.placeUnit = (key, loc) => {
            get(ref(db, `games/drill_v30/sector_staging/${key}`)).then(s => {
                let v = s.val();
                remove(ref(db, `games/drill_v30/sector_staging/${key}`));
                push(ref(db, `games/drill_v30/units`), {
                    type:'unit', sub:v.type, lat:loc.lat, lng:loc.lng, sector:mySector, water:100, status:'idle', callSign:Math.floor(Math.random()*100)+400
                });
                logSys("הצבת כוח");
                resetTool();
            });
        };
        
        window.editMeteo = () => {
            let w=prompt("רוח",gameState.wind), d=prompt("כיוון",gameState.windDir), t=prompt("טמפ",gameState.temp);
            if(w) update(ref(db, `games/drill_v30/state`), {wind:parseInt(w), windDir:parseInt(d), temp:parseInt(t)});
        };
        
        window.updateMeteoUI = () => {
            document.getElementById('val-wind').innerText = gameState.wind;
            document.getElementById('val-dir').innerText = gameState.windDir;
            document.getElementById('val-temp').innerText = gameState.temp;
        };

        window.logSys = (txt) => push(ref(db, `games/drill_v30/logs`), {text:txt, user:myName, role:getRoleName(), time:Date.now()});
        
        window.sendChat = () => {
            let t = document.getElementById('chat-in').value;
            if(t) logSys(t);
            document.getElementById('chat-in').value="";
        };

        window.generateReport = () => {
            document.getElementById('rep-date').innerText = new Date().toLocaleString('he-IL');
            window.print();
        };

        window.approveReq = (k, type) => {
            if(type==='D9') {
                 // D9 Approval Logic: just log it, Sector cmdr draws it.
                 logSys(`אושר D9 ל${myRole}`); // Simplification
            } else {
                 addBank(type);
            }
            remove(ref(db, `games/drill_v30/requests/${k}`));
        };

        // PTT
        document.body.onkeydown = (e) => {
            if(e.code==='Space' && document.activeElement.tagName!=='INPUT') {
                 // Mock PTT - in real app needs HTTPS
                 document.getElementById('chat-in').focus();
            }
        };

        function getGameTime() { return (Date.now()-gameState.start)*TIME_FACTOR; }
        function gameLoop() {
            let gt = getGameTime();
            let min = Math.floor(gt/60000);
            document.getElementById('clock-display').innerText = `T+${Math.floor(min/60)}:${String(min%60).padStart(2,'0')}`;
            
            // Fire Intensity Snooze Check (Every 15 min game time)
            if(myRole==='admin' && min > 0 && min % 15 === 0 && min !== window.lastSnooze) {
                window.lastSnooze = min;
                if(confirm("עברו 15 דקות. להעלות דרגת אש?")) {
                    // Logic to find all fires and increase level would go here
                    logSys("העלאת דרגת אש");
                }
            }
        }
        
        window.resetAll = () => { if(confirm("איפוס?")) remove(ref(db, `games/drill_v30`)).then(()=>location.reload()); };
    </script>
</body>
</html>
