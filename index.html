<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>מערכת שו"ב - V26 (Commander Edition)</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* BASE LAYOUT */
        body { margin: 0; height: 100vh; overflow: hidden; font-family: 'Segoe UI', sans-serif; background: #2c3e50; }
        
        /* HEADER */
        #top-bar { 
            height: 70px; background: #1a1a1a; color: white; display: flex; align-items: center; 
            justify-content: space-between; padding: 0 15px; border-bottom: 4px solid #c0392b; z-index: 2000; position: relative;
        }
        .header-section { display: flex; align-items: center; gap: 15px; }
        .logo-img { height: 60px; width: auto; border: 2px solid white; border-radius: 50%; background: white; }
        .meteo-box { background: #34495e; padding: 5px 10px; border-radius: 5px; border: 1px solid #7f8c8d; font-size: 0.9rem; text-align: center; }
        .clock-display { font-family: monospace; font-size: 1.4rem; font-weight: bold; color: #f1c40f; text-shadow: 1px 1px 2px black; }

        /* MAP & SIDEBAR */
        #main-container { display: flex; flex: 1; height: calc(100vh - 70px); }
        #map { flex: 1; background: #333; position: relative; }
        #sidebar { width: 350px; background: #f8f9fa; display: flex; flex-direction: column; border-right: 2px solid #ccc; z-index: 1500; }

        /* LOGIN */
        #login-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(44, 62, 80, 0.98); z-index: 9999; display: flex; align-items: center; justify-content: center; }
        .login-box { background: white; padding: 30px; border-radius: 12px; width: 550px; text-align: center; box-shadow: 0 10px 40px rgba(0,0,0,0.6); }
        .role-btn { width: 100%; height: 60px; font-size: 1.1rem; margin-bottom: 8px; border: 2px solid #e0e0e0; background: white; transition: 0.2s; border-radius: 8px; }
        .role-btn:hover { background: #f5f5f5; border-color: #bdc3c7; }
        .role-btn.selected { border-color: #c0392b; background: #fff5f5; color: #c0392b; font-weight: bold; box-shadow: 0 0 10px rgba(192, 57, 43, 0.2); }

        /* FLOATING TOOLS */
        .draggable-panel { 
            position: absolute; background: rgba(255, 255, 255, 0.95); 
            border-radius: 8px; box-shadow: 0 5px 15px rgba(0,0,0,0.3); 
            z-index: 1000; min-width: 60px; display: flex; flex-direction: column; 
            border: 1px solid #ccc; overflow: hidden;
        }
        .panel-handle { background: #2c3e50; height: 15px; cursor: move; width: 100%; }
        .tool-grid { display: grid; grid-template-columns: 1fr; gap: 5px; padding: 5px; }
        .btn-tool { width: 45px; height: 45px; border: 1px solid #bdc3c7; background: white; border-radius: 6px; font-size: 20px; cursor: pointer; transition: 0.2s; }
        .btn-tool:hover { background: #ecf0f1; }
        .btn-tool.active { background: #3498db; color: white; border-color: #2980b9; }

        /* RESOURCE BANK (IC) */
        #resource-bank { position: absolute; bottom: 20px; left: 20px; width: 400px; height: 150px; background: rgba(44, 62, 80, 0.9); color: white; border-radius: 8px; z-index: 2000; display: none; flex-direction: column; border: 2px solid #f39c12; }
        .bank-header { padding: 5px 10px; background: #f39c12; color: #2c3e50; font-weight: bold; font-size: 0.9rem; }
        .bank-content { flex: 1; padding: 10px; overflow-x: auto; display: flex; gap: 10px; align-items: center; }
        .bank-item { background: white; color: black; padding: 5px 10px; border-radius: 5px; cursor: pointer; display: flex; flex-direction: column; align-items: center; min-width: 60px; font-size: 0.8rem; border: 2px solid transparent; }
        .bank-item:hover { transform: scale(1.05); }
        .bank-item.selected { border-color: #3498db; background: #eaf2f8; }

        /* LOGS & SIDEBAR */
        #log-area { flex: 1; overflow-y: auto; padding: 10px; background: #e9ecef; font-size: 0.8rem; border-bottom: 1px solid #ccc; }
        .log-entry { margin-bottom: 4px; padding: 5px; background: white; border-right: 3px solid #bdc3c7; border-radius: 3px; }
        .log-sys { border-right-color: #c0392b; background: #fff0f0; }

        /* MAP ICONS & SYMBOLS */
        .icon-unit-base { background: white; border: 2px solid black; display: flex; justify-content: center; align-items: center; font-weight: bold; font-size: 10px; position: relative; box-shadow: 2px 2px 4px rgba(0,0,0,0.5); }
        .unit-saar { width: 36px; height: 22px; border-color: #c0392b; color: #c0392b; }
        .unit-eshed { width: 46px; height: 26px; border-color: #8e44ad; color: #8e44ad; }
        .unit-water-bg { position: absolute; bottom: 0; left: 0; width: 100%; height: 3px; background: #ccc; }
        .unit-water-lvl { height: 100%; background: #3498db; }
        
        .icon-cp { font-size: 28px; color: #c0392b; filter: drop-shadow(0 0 2px white); }
        .icon-staging { width: 30px; height: 30px; border: 3px solid #c0392b; border-radius: 50%; color: #c0392b; background: rgba(255,255,255,0.85); font-weight: 900; display: flex; justify-content: center; align-items: center; }

        /* SECTOR LABELS */
        .sector-label { background: transparent; border: none; color: orange; font-weight: bold; font-size: 16px; text-shadow: 1px 1px 2px black; text-align: center; }
    </style>
</head>
<body>

    <div id="login-overlay">
        <div class="login-box">
            <h2 class="text-danger mb-4"><i class="fa-solid fa-fire"></i> מערכת שו"ב </h2>
            <div id="login-step-1">
                <h5 class="mb-3">בחר תפקיד:</h5>
                <div class="row g-2 mb-3">
                    <div class="col-4"><button class="btn role-btn" onclick="selectRole('admin', this)">מנהלת<br><small>(Admin)</small></button></div>
                    <div class="col-4"><button class="btn role-btn" onclick="selectRole('ic', this)">מפקד אירוע<br><small>(IC)</small></button></div>
                    <div class="col-4"><button class="btn role-btn" onclick="selectRole('sector', this)">מפקד גזרה<br><small>(Sector)</small></button></div>
                </div>
                
                <div id="sector-select" class="mb-3" style="display:none;">
                    <label class="form-label fw-bold">בחר גזרה:</label>
                    <select class="form-select text-center" id="sector-letter">
                        <option value="א">גזרה א'</option>
                        <option value="ב">גזרה ב'</option>
                        <option value="ג">גזרה ג'</option>
                        <option value="ד">גזרה ד'</option>
                    </select>
                </div>

                <input type="text" id="username" class="form-control mb-3 text-center" placeholder="שם משתמש (לדוגמה: רשף כהן)">
                <input type="text" id="game-id" class="form-control mb-4 text-center" value="drill_v26">
                <button class="btn btn-danger w-100 py-3 fw-bold fs-5" onclick="enterSystem()">כניסה למערכת</button>
            </div>
        </div>
    </div>

    <div id="top-bar">
        <div class="header-section">
            <span id="user-badge" class="badge bg-secondary p-2 fs-6">אורח</span>
            <div class="meteo-box">
                <div id="wind-data"><i class="fa-solid fa-wind"></i> 0 קמ"ש</div>
                <div id="temp-data" style="font-size:0.7em; color:#bdc3c7">25°C | 30% לחות</div>
            </div>
        </div>

        <div class="header-section text-center">
            <div style="font-size:0.7em; color:#aaa">זמן מבצעי (x10)</div>
            <div id="game-clock" class="clock-display">T+00:00</div>
        </div>

        <div class="header-section">
            <button class="btn btn-sm btn-outline-light" onclick="printReport()"><i class="fa-solid fa-print"></i> יומן</button>
            <img src="logo.jpg" class="logo-img" alt="לוגו מגמה" onerror="this.src='https://via.placeholder.com/60?text=LOGO'">
        </div>
    </div>

    <div id="main-container">
        
        <div id="map">
            
            <div class="draggable-panel" id="panel-admin" style="top: 20px; right: 20px; display:none;">
                <div class="panel-handle"></div>
                <div class="tool-grid">
                    <button class="btn-tool" onclick="setTool('fire')" title="הצצת אש"><i class="fa-solid fa-fire text-danger"></i></button>
                    <button class="btn-tool" onclick="setTool('water')" title="מקור מים"><i class="fa-solid fa-droplet text-primary"></i></button>
                    <button class="btn-tool" onclick="updateMeteo()" title="מזג אוויר"><i class="fa-solid fa-cloud-sun"></i></button>
                    <button class="btn-tool" onclick="addResToBank('saar')" title="הוסף סער לבנק"><i class="fa-solid fa-truck-pickup text-success"></i>+</button>
                    <button class="btn-tool" onclick="addResToBank('eshed')" title="הוסף אשד לבנק"><i class="fa-solid fa-truck text-success"></i>+</button>
                    <button class="btn-tool" onclick="resetGame()" title="איפוס"><i class="fa-solid fa-trash"></i></button>
                </div>
            </div>

            <div class="draggable-panel" id="panel-ic" style="top: 20px; right: 80px; display:none;">
                <div class="panel-handle"></div>
                <div class="tool-grid">
                    <button class="btn-tool" onclick="setTool('cp')" title="חפ''ק"><i class="fa-solid fa-flag text-danger"></i></button>
                    <button class="btn-tool" onclick="setTool('staging')" title="שטח כינוס"><i class="fa-solid fa-circle-h text-danger"></i></button>
                    <button class="btn-tool" onclick="setTool('sector_draw')" title="שרטוט גזרה (אוטומטי)"><i class="fa-solid fa-draw-polygon text-warning"></i></button>
                    <button class="btn-tool" onclick="setTool('arrow')" title="חץ תקיפה"><i class="fa-solid fa-arrow-right"></i></button>
                </div>
            </div>

            <div class="draggable-panel" id="panel-sector" style="top: 250px; right: 20px; display:none;">
                <div class="panel-handle"></div>
                <div class="tool-grid">
                    <button class="btn-tool" onclick="requestRes('saar')" title="בקש סער"><i class="fa-solid fa-truck-pickup"></i>?</button>
                    <button class="btn-tool" onclick="requestRes('eshed')" title="בקש אשד"><i class="fa-solid fa-truck"></i>?</button>
                    <button class="btn-tool" onclick="activateMove()" id="btn-move" title="הזזת כוח"><i class="fa-solid fa-up-down-left-right text-primary"></i></button>
                    <button class="btn-tool" onclick="setTool('dozer')" title="D9"><i class="fa-solid fa-snowplow"></i></button>
                </div>
            </div>

            <div id="resource-bank">
                <div class="bank-header">בנק כוחות (עתודה) - גרור למפה</div>
                <div class="bank-content" id="bank-list">
                    <div class="text-center w-100 small">אין כוחות זמינים</div>
                </div>
            </div>

        </div>

        <div id="sidebar">
            <div class="p-2 bg-white border-bottom fw-bold text-center">
                <i class="fa-solid fa-list-check"></i> יומן אירועים
            </div>
            <div id="log-area"></div>
            
            <div id="requests-area" class="p-2 bg-warning bg-opacity-10 border-top" style="display:none;">
                <strong><i class="fa-solid fa-envelope"></i> בקשות:</strong>
                <div id="req-list"></div>
            </div>

            <div class="p-2 border-top bg-white">
                <div class="input-group">
                    <input type="text" id="chat-input" class="form-control" placeholder="פקודה / דיווח...">
                    <button class="btn btn-primary" onclick="sendChat()">שלח</button>
                </div>
                <small class="text-muted">טיפ: לחץ רווח לדיבור</small>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, set, onValue, push, update, remove, get } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAprkTQI8h7ngt186yQSeYuBR37J7jjQBs",
            authDomain: "firesim2026.firebaseapp.com",
            databaseURL: "https://firesim2026-default-rtdb.firebaseio.com",
            projectId: "firesim2026",
            storageBucket: "firesim2026.firebasestorage.app",
            messagingSenderId: "816221488429",
            appId: "1:816221488429:web:8422845f75f8656d2abfa4",
            measurementId: "G-P77FYQT1C7"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // STATE
        let map, layers={};
        let myRole=null, myName="", mySector=null;
        let activeTool=null, selectedUnit=null, activeBankItem=null;
        let polyPoints=[];
        let dragStart=null, tempLine=null;
        const TIME_FACTOR = 10;
        let gameState = { start: Date.now(), wind: 0, windDir: 0, sectors: 0 };

        // --- INIT & LOGIN ---
        window.selectRole = (role, btn) => {
            document.querySelectorAll('.role-btn').forEach(b => b.classList.remove('selected'));
            btn.classList.add('selected');
            myRole = role;
            document.getElementById('sector-select').style.display = (role === 'sector') ? 'block' : 'none';
        };

        window.enterSystem = () => {
            if(!myRole) return alert("בחר תפקיד");
            myName = document.getElementById('username').value || "User";
            if(myRole==='sector') mySector = document.getElementById('sector-letter').value;

            document.getElementById('login-overlay').style.display = 'none';
            
            // User Badge Update
            let roleTitle = myRole==='admin'?'מנהלת':(myRole==='ic'?'מפקד אירוע':`מפקד גזרה ${mySector}`);
            document.getElementById('user-badge').innerText = `${myName} | ${roleTitle}`;
            
            // Log Login
            logAction(`התחבר למערכת בתור ${roleTitle}`);

            // UI Setup
            setupUI();
            
            // Start Engine
            setTimeout(() => {
                initMap();
                syncFirebase();
                setInterval(gameLoop, 1000);
            }, 500);
        };

        function setupUI() {
            if(myRole==='admin') {
                document.getElementById('panel-admin').style.display='flex';
                document.getElementById('panel-sector').style.display='flex'; 
            } else if(myRole==='ic') {
                document.getElementById('panel-ic').style.display='flex';
                document.getElementById('panel-sector').style.display='flex';
                document.getElementById('resource-bank').style.display='flex';
                document.getElementById('requests-area').style.display='block';
            } else {
                document.getElementById('panel-sector').style.display='flex';
            }
            
            // Make panels draggable
            document.querySelectorAll('.draggable-panel').forEach(p => {
                let header = p.querySelector('.panel-handle');
                header.onmousedown = (e) => {
                    e.preventDefault();
                    let startX = e.clientX, startY = e.clientY;
                    document.onmousemove = (e) => {
                        e.preventDefault();
                        p.style.top = (p.offsetTop - (startY - e.clientY)) + "px";
                        p.style.left = (p.offsetLeft - (startX - e.clientX)) + "px";
                        startX = e.clientX; startY = e.clientY;
                    };
                    document.onmouseup = () => { document.onmousemove = null; };
                };
            });
        }

        // --- MAP ENGINE ---
        function initMap() {
            map = L.map('map').setView([32.73, 35.03], 14);
            L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}').addTo(map);
            L.tileLayer('https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png', {opacity: 0.4}).addTo(map);

            layers.fire = L.layerGroup().addTo(map);
            layers.polys = L.layerGroup().addTo(map); // Sectors
            layers.units = L.layerGroup().addTo(map);
            layers.drawings = L.layerGroup().addTo(map);
            layers.markers = L.layerGroup().addTo(map);

            map.on('click', onMapClick);
            map.on('mousedown', e => {
                if(['arrow','dozer'].includes(activeTool)) { map.dragging.disable(); dragStart=e.latlng; }
            });
            map.on('mousemove', e => {
                if(dragStart) {
                    if(tempLine) map.removeLayer(tempLine);
                    let c = activeTool==='dozer'?'black':'red';
                    tempLine = L.polyline([dragStart, e.latlng], {color:c, weight:4}).addTo(map);
                }
            });
            map.on('mouseup', e => {
                if(dragStart) {
                    finishDrag(e.latlng);
                    dragStart=null; map.dragging.enable(); if(tempLine) map.removeLayer(tempLine);
                }
            });
            setTimeout(()=>map.invalidateSize(), 500);
        }

        // --- INTERACTION ---
        function onMapClick(e) {
            const loc = e.latlng;

            // 1. Drawing Sectors (IC)
            if(activeTool === 'sector_draw') {
                polyPoints.push(loc);
                L.marker(loc, {icon:L.divIcon({className:'bg-warning rounded-circle', iconSize:[8,8]})}).addTo(layers.drawings);
                if(polyPoints.length > 2 && confirm("לסגור גזרה?")) {
                    createSector(polyPoints);
                    polyPoints = [];
                }
                return;
            }

            // 2. Deployment from Bank (IC)
            if(activeTool === 'deploy_bank' && activeBankItem) {
                deployUnitFromBank(activeBankItem, loc);
                return;
            }

            // 3. Move Unit
            if(activeTool === 'move_dest' && selectedUnit) {
                update(ref(db, `games/drill_v26/units/${selectedUnit}`), {
                    destLat: loc.lat, destLng: loc.lng, status: 'moving'
                });
                logAction(`פקודת תנועה לרכב`);
                activeTool = 'move_select'; selectedUnit=null; 
                return;
            }

            if(!activeTool) return;

            // 4. Placements
            let type = null, sub = activeTool;
            if(activeTool === 'fire' && myRole === 'admin') type='fire';
            else if(activeTool === 'cp') type='marker';
            else if(activeTool === 'staging') type='marker';
            else if(activeTool === 'water') { type='marker'; sub='water'; }

            if(type) {
                push(ref(db, `games/drill_v26/units`), {
                    type: type, subType: sub, lat: loc.lat, lng: loc.lng,
                    start: getGameTime()
                });
                logAction(`הציב ${sub} בנקודה ${loc.lat.toFixed(4)}`);
            }

            if(!['arrow','dozer','sector_draw'].includes(activeTool)) resetTool();
        }

        function finishDrag(end) {
            if(activeTool === 'dozer') {
                let mode = prompt("1-מלא, 2-חלקי","1")==='1'?'full':'partial';
                push(ref(db, `games/drill_v26/units`), {
                    type:'drawing', subType:'dozer', p1:dragStart, p2:end, mode:mode, created:getGameTime()
                });
                logAction("סימון קו D9");
            } else {
                push(ref(db, `games/drill_v26/units`), {
                    type:'drawing', subType:activeTool, p1:dragStart, p2:end
                });
                logAction("שרטוט חץ תקיפה");
            }
            resetTool();
        }

        // --- LOGIC: SECTORS & RESOURCES ---
        async function createSector(points) {
            // Get current sector count to name next one
            const s = await get(ref(db, `games/drill_v26/state/sectors`));
            let count = s.val() || 0;
            let name = String.fromCharCode(1488 + count); // א, ב, ג...
            
            // Save sector
            push(ref(db, `games/drill_v26/units`), {
                type: 'sector', name: name, points: points
            });
            update(ref(db, `games/drill_v26/state`), { sectors: count + 1 });
            logAction(`הגדיר גזרה ${name}`);
        }

        window.addResToBank = (type) => {
            push(ref(db, `games/drill_v26/bank`), { type: type, status: 'available' });
            logAction(`הוסיף ${type} לבנק הכוחות`);
        };

        function deployUnitFromBank(key, loc) {
            // Move from bank to map
            remove(ref(db, `games/drill_v26/bank/${key}`));
            
            // Determine Sector (Simple geo check or manual assign - simpler here: assign to 'General' initially)
            // Or IC can assign sector later.
            
            push(ref(db, `games/drill_v26/units`), {
                type: 'unit', subType: activeBankItem.type,
                lat: loc.lat, lng: loc.lng,
                water: 100, status: 'idle',
                callSign: Math.floor(Math.random()*100)+400
            });
            logAction(`פרס כוח מהעתודה`);
            activeBankItem = null;
            resetTool();
        }

        window.requestRes = (type) => {
            if(myRole==='admin') { addResToBank(type); return; } // Admin bypass
            push(ref(db, `games/drill_v26/requests`), { type:type, by:myName, sector:mySector||'?', time:Date.now() });
            logAction(`ביקש תגבורת ${type}`);
            alert("הבקשה נשלחה למפקד האירוע");
        };

        // --- SYNC & RENDER ---
        function syncFirebase() {
            // 1. STATE
            onValue(ref(db, `games/drill_v26/state`), s => {
                let v = s.val();
                if(v) { 
                    gameState = {...gameState, ...v};
                    document.getElementById('wind-data').innerHTML = `<i class="fa-solid fa-wind"></i> ${gameState.wind||0} קמ"ש (${gameState.windDir||0}°)`;
                }
                else if(myRole==='admin') set(ref(db, `games/drill_v26/state`), {start:Date.now(), wind:10});
            });

            // 2. UNITS & MAP
            onValue(ref(db, `games/drill_v26/units`), s => renderMap(s.val()));

            // 3. BANK (IC)
            if(myRole === 'ic') {
                onValue(ref(db, `games/drill_v26/bank`), s => renderBank(s.val()));
                onValue(ref(db, `games/drill_v26/requests`), s => renderRequests(s.val()));
            }

            // 4. LOGS
            onValue(ref(db, `games/drill_v26/logs`), s => renderLogs(s.val()));
        }

        function renderMap(data) {
            layers.fire.clearLayers(); layers.polys.clearLayers(); layers.units.clearLayers();
            layers.drawings.clearLayers(); layers.markers.clearLayers();
            
            if(!data) return;
            const gt = getGameTime();

            Object.entries(data).forEach(([k, obj]) => {
                
                // SECTOR FILTERING (The Constraint!)
                // If I am a sector commander, I should ideally visually focus on my sector.
                // For V26, we show everything but highlighting could be added.
                // Since user asked "exposed to forces he has... only", we could hide others.
                // But in a shared map, usually you see neighbors. 
                // Implementing: Show All (Standard Ops), but could filter:
                // if(myRole==='sector' && obj.sector && obj.sector !== mySector) return; 

                if(obj.type === 'sector') {
                    const poly = L.polygon(obj.points, {color:'orange', fillOpacity:0.1, weight:2, dashArray:'5,5'}).addTo(layers.polys);
                    // Label
                    const center = poly.getBounds().getCenter();
                    L.marker(center, {icon:L.divIcon({className:'sector-label', html:`גזרה ${obj.name}`, iconSize:[100,20]})}).addTo(layers.polys);
                }

                else if(obj.type === 'unit') {
                    let pos = [obj.lat, obj.lng];
                    if(obj.status==='moving' && obj.destLat) pos = [obj.destLat, obj.destLng]; // Teleport for now

                    let cls = obj.subType==='saar'?'unit-saar':'unit-eshed';
                    let html = `<div class="icon-unit-base ${cls}">${obj.callSign}<div class="unit-water-bg"><div class="unit-water-lvl" style="width:${obj.water}%"></div></div></div>`;
                    
                    let m = L.marker(pos, {icon:L.divIcon({html:html, className:''})}).addTo(layers.units);
                    m.on('click', () => {
                        if(activeTool === 'move_select') {
                            // Sector Commander Security Check
                            // if(myRole === 'sector' && obj.sector !== mySector) return alert("לא בגזרה שלך");
                            selectedUnit = k; activeTool='move_dest'; document.getElementById('map').style.cursor='crosshair'; alert("בחר יעד");
                        }
                    });
                }
                
                else if(obj.type === 'fire') {
                    // Simple growth logic
                    let el = (gt - obj.start)/1000;
                    let r = 20 + (el * (gameState.wind/20));
                    // Wind Shift
                    let shift = el * (gameState.wind/100000);
                    L.circle([obj.lat+shift, obj.lng+shift], {radius:r, color:'red', fillColor:'#e67e22', fillOpacity:0.6}).addTo(layers.fire);
                }

                else if(obj.type === 'drawing') {
                    let col = obj.subType==='dozer'?'black':'red';
                    let w = obj.subType==='arrow'?6:4;
                    L.polyline([obj.p1, obj.p2], {color:col, weight:w}).addTo(layers.drawings);
                }
                
                else if(obj.type === 'marker') {
                     let h = '';
                     if(obj.subType==='cp') h='<i class="fa-solid fa-flag icon-cp"></i>';
                     if(obj.subType==='staging') h='<div class="icon-staging">S</div>';
                     if(obj.subType==='water') h='<i class="fa-solid fa-droplet text-primary fs-3"></i>';
                     L.marker([obj.lat, obj.lng], {icon:L.divIcon({html:h, className:''})}).addTo(layers.markers);
                }
            });
        }

        function renderBank(data) {
            const list = document.getElementById('bank-list');
            list.innerHTML = "";
            if(!data) { list.innerHTML="<small>ריק</small>"; return; }
            
            Object.entries(data).forEach(([k, v]) => {
                let div = document.createElement('div');
                div.className = 'bank-item';
                div.innerHTML = `<i class="fa-solid fa-truck"></i> <span>${v.type}</span>`;
                div.onclick = () => {
                    document.querySelectorAll('.bank-item').forEach(b=>b.classList.remove('selected'));
                    div.classList.add('selected');
                    activeTool = 'deploy_bank';
                    activeBankItem = { key: k, type: v.type };
                    activeBankItem.type = v.type;
                    document.getElementById('map').style.cursor = 'crosshair';
                };
                list.appendChild(div);
            });
        }

        function renderLogs(data) {
            const div = document.getElementById('log-area');
            div.innerHTML="";
            if(data) Object.values(data).slice(-30).forEach(l => {
                let t = new Date(l.time).toLocaleTimeString('he-IL',{hour:'2-digit',minute:'2-digit'});
                div.innerHTML += `<div class="log-entry ${l.sys?'log-sys':''}"><small>${t}</small> <b>${l.user}</b>: ${l.text}</div>`;
            });
            div.scrollTop = div.scrollHeight;
        }

        // --- UTILS & HELPERS ---
        window.setTool = (t) => {
            activeTool = t; 
            if(t!=='move_select') selectedUnit=null;
            document.getElementById('map').style.cursor = 'crosshair';
            document.querySelectorAll('.btn-tool').forEach(b=>b.classList.remove('active'));
            if(event && event.currentTarget) event.currentTarget.classList.add('active');
        };
        
        window.resetTool = () => {
            activeTool = null; document.getElementById('map').style.cursor='grab';
            document.querySelectorAll('.btn-tool').forEach(b=>b.classList.remove('active'));
        };

        window.activateMove = () => {
            activeTool = 'move_select';
            document.getElementById('map').style.cursor='pointer';
            document.getElementById('btn-move').classList.add('active');
            alert("בחר רכב להזזה");
        };

        window.updateMeteo = () => {
            let w = prompt("מהירות רוח", gameState.wind);
            let d = prompt("כיוון רוח (0-360)", gameState.windDir);
            if(w&&d) {
                update(ref(db, `games/drill_v26/state`), {wind:parseInt(w), windDir:parseInt(d)});
                logAction(`עדכן מזג אוויר: ${w} קמ"ש`);
            }
        };

        window.logAction = (text) => {
            push(ref(db, `games/drill_v26/logs`), {
                text: text, user: myName, role: myRole, time: Date.now(), sys: true
            });
        };

        window.sendChat = () => {
            let txt = document.getElementById('chat-input').value;
            if(txt) push(ref(db, `games/drill_v26/logs`), {
                text: txt, user: myName, role: myRole, time: Date.now()
            });
            document.getElementById('chat-input').value = "";
        };
        
        window.printReport = () => window.print();

        function getGameTime() { return (Date.now() - gameState.start) * TIME_FACTOR; }
        
        function gameLoop() {
            let gt = getGameTime();
            let min = Math.floor(gt/60000);
            document.getElementById('game-clock').innerText = `T+${Math.floor(min/60)}:${String(min%60).padStart(2,'0')}`;
        }
    </script>
</body>
</html>
